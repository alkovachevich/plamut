<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plamut</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="floating-logo">P</div>

<div id="app">

  <!-- HOME -->
  <div id="home-screen" class="screen active">
    <div class="home-actions">
      <button onclick="openLibrary()">Библиотека</button>
      <button onclick="alert('Share')">Поделиться</button>
    </div>
  </div>

  <!-- LIBRARY -->
  <div id="library-screen" class="screen">
    <input placeholder="Поиск..." oninput="search(this.value)">
    <div class="categories">
      <div onclick="openCategory('books')">Books</div>
      <div onclick="openCategory('movies')">Movies</div>
    </div>
  </div>

  <!-- CATEGORY -->
  <div id="category-screen" class="screen">
    <div class="top-bar">
      <button onclick="back()">←</button>
      <button onclick="filter()">Фильтр</button>
    </div>
    <div id="grid" class="grid"></div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plamut</title>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    :root {
      color-scheme: dark;

      --bg: #111318;
      --bg-elevated: #181b22;
      --bg-soft: #20242d;
      --surface: #262b35;
      --surface-strong: #2d3440;

      --text: #f3f5f8;
      --text-soft: #c3cad5;
      --text-muted: #98a3b3;

      --border: #343c49;
      --border-soft: #2b313c;

      --accent: #6ea8ff;
      --accent-strong: #4e8fff;
      --accent-soft: rgba(110, 168, 255, 0.18);

      --success: #62d394;
      --warning: #f6c56b;
      --danger: #ff7c8b;

      --shadow: 0 16px 40px rgba(0, 0, 0, 0.34);

      --header-height: 64px;
      --content-max-width: 1100px;
    }

    [data-theme="light"] {
      color-scheme: light;

      --bg: #f5f7fb;
      --bg-elevated: #ffffff;
      --bg-soft: #eef2f7;
      --surface: #ffffff;
      --surface-strong: #f8fbff;

      --text: #141923;
      --text-soft: #546071;
      --text-muted: #7b8796;

      --border: #d7e0ea;
      --border-soft: #e5ebf2;

      --accent: #4e8fff;
      --accent-strong: #2f73f6;
      --accent-soft: rgba(78, 143, 255, 0.12);

      --success: #2eaf6d;
      --warning: #c99525;
      --danger: #df5d6c;

      --shadow: 0 12px 32px rgba(19, 31, 54, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      background:
        radial-gradient(circle at top, rgba(110, 168, 255, 0.06), transparent 28%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.45;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    button {
      border: none;
      cursor: pointer;
      font: inherit;
      background: transparent;
    }

    input,
    textarea,
    select {
      font: inherit;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .app {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    #app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      background: rgba(17, 19, 24, 0.72);
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    [data-theme="light"] #app-header {
      background: rgba(245, 247, 251, 0.78);
      border-bottom: 1px solid rgba(20, 25, 35, 0.05);
    }

    #app-main {
      width: min(100%, var(--content-max-width));
      margin: 0 auto;
      padding: 20px 16px 40px;
      flex: 1;
    }

    #sidebar-root,
    #search-modal-root,
    #auth-modal-root {
      position: relative;
      z-index: 100;
    }

    ::selection {
      background: var(--accent-soft);
      color: var(--text);
    }

    ::placeholder {
      color: var(--text-muted);
      opacity: 1;
    }

    input,
    textarea,
    select {
      color: var(--text);
      caret-color: var(--accent);
    }

    @media (max-width: 640px) {
      #app-main {
        padding: 16px 12px 32px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header id="app-header"></header>

    <main id="app-main"></main>

    <div id="sidebar-root"></div>
    <div id="search-modal-root"></div>
    <div id="auth-modal-root"></div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>

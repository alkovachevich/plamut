<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plamut</title>

  <!-- Supabase -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #0b0f14;
      --bg-elevated: #11161d;
      --bg-soft: #161c24;
      --surface: #1b222c;

      --text: #e8edf3;
      --text-soft: #9aa6b2;
      --text-muted: #6b7683;

      --border: #232b36;

      --accent: #5b8cff;
      --accent-strong: #3b6bff;
      --accent-soft: rgba(91, 140, 255, 0.15);

      --danger: #ff5b6e;

      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);

      --header-height: 64px;
      --content-max-width: 1100px;
    }

    [data-theme="light"] {
      --bg: #f6f8fb;
      --bg-elevated: #ffffff;
      --bg-soft: #eef2f7;
      --surface: #ffffff;

      --text: #0f1720;
      --text-soft: #5b6775;
      --text-muted: #7c8794;

      --border: #dbe2ea;

      --accent-soft: rgba(91, 140, 255, 0.12);

      --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    button {
      border: none;
      cursor: pointer;
      font: inherit;
    }

    input, textarea {
      font: inherit;
    }

    /* Layout */

    .app {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    #app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(8px);
      background: rgba(10, 14, 20, 0.6);
    }

    #app-main {
      width: min(100%, var(--content-max-width));
      margin: 0 auto;
      padding: 20px 16px 40px;
      flex: 1;
    }

    /* Containers for overlays */

    #sidebar-root,
    #search-modal-root,
    #auth-modal-root {
      position: relative;
      z-index: 100;
    }
  </style>
</head>

<body>
  <div class="app">
    <header id="app-header"></header>

    <main id="app-main"></main>

    <!-- overlays -->
    <div id="sidebar-root"></div>
    <div id="search-modal-root"></div>
    <div id="auth-modal-root"></div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>

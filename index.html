<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plamut</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#111;
      color:white;
      margin:0;
      padding:30px;
    }

    h1,h2,h3{
      margin-top:0;
    }

    .subtitle{
      color:#888;
      margin-bottom:30px;
    }

    .hidden{
      display:none !important;
    }

    .top-right{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:20px;
    }

    .lang-switch{
      display:flex;
      gap:8px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
      gap:20px;
      max-width:1000px;
    }

    .card{
      background:#1a1a1a;
      border:1px solid #333;
      border-radius:14px;
      padding:20px;
      text-align:center;
      cursor:pointer;
      transition:.2s;
    }

    .card:hover{
      background:#222;
    }

    .topbar{
      display:flex;
      gap:12px;
      align-items:center;
      margin-bottom:24px;
      flex-wrap:wrap;
    }

    .button{
      background:#2a2a2a;
      color:white;
      border:1px solid #444;
      border-radius:10px;
      padding:10px 14px;
      cursor:pointer;
    }

    .button:hover{
      background:#333;
    }

    .shelf{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
      gap:18px;
      max-width:1100px;
    }

    .media-card{
      background:#1a1a1a;
      border:1px solid #333;
      border-radius:14px;
      overflow:hidden;
    }

    .media-cover{
      height:220px;
      background:#2b2b2b;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#999;
      font-size:14px;
    }

    .media-cover img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .media-info{
      padding:14px;
    }

    .media-title{
      font-size:16px;
      margin:0 0 8px 0;
    }

    .media-meta{
      font-size:13px;
      color:#aaa;
      margin-bottom:8px;
    }

    .media-status{
      font-size:13px;
      color:#aaa;
      margin-bottom:12px;
    }

    .media-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .add-btn{
      background:#3a3a3a;
      color:white;
      border:none;
      border-radius:8px;
      padding:8px 10px;
      cursor:pointer;
    }

    .add-btn:hover{
      background:#4a4a4a;
    }

    .modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.7);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      z-index:1000;
    }

    .modal-box{
      width:100%;
      max-width:560px;
      background:#1a1a1a;
      border:1px solid #333;
      border-radius:16px;
      padding:20px;
      max-height:85vh;
      overflow:auto;
    }

    .input,
    .textarea{
      width:100%;
      box-sizing:border-box;
      background:#111;
      color:white;
      border:1px solid #444;
      border-radius:10px;
      padding:12px;
      margin-bottom:12px;
      font:inherit;
    }

    .textarea{
      min-height:120px;
      resize:vertical;
    }

    .modal-actions{
      display:flex;
      gap:10px;
      justify-content:flex-end;
      margin-top:8px;
      flex-wrap:wrap;
    }

    .small{
      color:#888;
      font-size:13px;
      margin-bottom:14px;
    }

    .search-item{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border:1px solid #333;
      border-radius:10px;
      margin-bottom:10px;
      background:#141414;
    }

    .search-item-left{
      min-width:0;
    }

    .search-item-title{
      font-size:14px;
      word-break:break-word;
    }

    .search-item-meta{
      font-size:12px;
      color:#888;
      margin-top:4px;
      word-break:break-word;
    }

    .details-layout{
      display:grid;
      grid-template-columns:minmax(220px, 280px) 1fr;
      gap:24px;
      max-width:1100px;
    }

    .details-cover{
      background:#1a1a1a;
      border:1px solid #333;
      border-radius:16px;
      overflow:hidden;
    }

    .details-cover-box{
      height:380px;
      background:#2b2b2b;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#999;
    }

    .details-cover-box img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .details-panel{
      background:#1a1a1a;
      border:1px solid #333;
      border-radius:16px;
      padding:20px;
    }

    .badge{
      display:inline-block;
      padding:6px 10px;
      border:1px solid #444;
      border-radius:999px;
      color:#bbb;
      font-size:12px;
      margin-right:8px;
      margin-bottom:8px;
    }

    .section{
      margin-top:24px;
    }

    .muted{
      color:#999;
      white-space:pre-wrap;
      word-break:break-word;
    }

    @media (max-width: 800px){
      .details-layout{
        grid-template-columns:1fr;
      }

      .details-cover-box{
        height:260px;
      }
    }
  </style>
</head>

<body>

  <div class="top-right">
    <div class="lang-switch">
      <button class="button" onclick="setLanguage('en')">EN</button>
      <button class="button" onclick="setLanguage('ru')">RU</button>
    </div>

    <div style="display:flex;gap:8px;align-items:center;">
      <button id="profile-btn" class="button hidden" onclick="openProfileModal()">Profile</button>
      <button id="login-top-btn" class="button hidden" onclick="showAuthScreen()">Login</button>
      <button id="logout-top-btn" class="button hidden" onclick="logout()">Logout</button>
    </div>
  </div>

  <div id="auth-screen">
    <h2>Plamut Login</h2>

    <input id="login-email" class="input" placeholder="Email">
    <input id="login-password" class="input" type="password" placeholder="Password">

    <div style="margin-top:10px;">
      <button class="button" onclick="login()">Login</button>
      <button class="button" onclick="register()">Register</button>
    </div>
  </div>

  <div id="home-screen" class="hidden">
    <h1>Plamut</h1>
    <div class="subtitle" id="home-subtitle"></div>

    <div class="grid">
      <div class="card" onclick="openCategory('Books')" id="cat-books"></div>
      <div class="card" onclick="openCategory('Movies')" id="cat-movies"></div>
      <div class="card" onclick="openCategory('Series')" id="cat-series"></div>
      <div class="card" onclick="openCategory('Anime')" id="cat-anime"></div>
      <div class="card" onclick="openCategory('Manga')" id="cat-manga"></div>
      <div class="card" onclick="openCategory('Blacklist')" id="cat-blacklist"></div>
    </div>

    <div style="margin-top:16px;">
      <button id="share-library-btn" class="button" onclick="shareLibrary()">Share Library</button>
    </div>
  </div>

  <div id="category-screen" class="hidden">
    <div class="topbar">
      <button class="button" onclick="goHome()" id="back-home-btn"></button>
      <h2 id="category-title" style="margin:0;"></h2>
      <button class="button" onclick="openAddModal()" id="add-new-btn"></button>
    </div>

    <div id="public-category-tabs" class="hidden" style="display:none;gap:8px;flex-wrap:wrap;margin-bottom:16px;">
      <button class="button" onclick="openPublicCategory('Books', currentPublicProfileName)" id="public-tab-books">Books</button>
      <button class="button" onclick="openPublicCategory('Movies', currentPublicProfileName)" id="public-tab-movies">Movies</button>
      <button class="button" onclick="openPublicCategory('Series', currentPublicProfileName)" id="public-tab-series">Series</button>
      <button class="button" onclick="openPublicCategory('Anime', currentPublicProfileName)" id="public-tab-anime">Anime</button>
      <button class="button" onclick="openPublicCategory('Manga', currentPublicProfileName)" id="public-tab-manga">Manga</button>
      <button class="button" onclick="openPublicCategory('Blacklist', currentPublicProfileName)" id="public-tab-blacklist">Blacklist</button>
    </div>

    <div class="shelf" id="shelf"></div>
  </div>

  <div id="details-screen" class="hidden">
    <div class="topbar">
      <button class="button" onclick="backToCategory()" id="back-shelf-btn"></button>
    </div>

    <div class="details-layout">
      <div class="details-cover">
        <div class="details-cover-box" id="details-cover-box"></div>
      </div>

      <div class="details-panel">
        <h2 id="details-title"></h2>
        <div class="muted" id="details-creator" style="margin-bottom:10px;"></div>

        <div>
          <span class="badge" id="details-category"></span>
          <span class="badge" id="details-status"></span>
        </div>

        <div class="section">
          <h3 id="description-label"></h3>
          <div class="muted" id="details-description"></div>
        </div>

        <div class="section" id="canonical-key-section">
          <h3>Canonical Key</h3>
          <input id="canonical-key-input" class="input" type="text">
          <button class="button" onclick="saveCanonicalKey()">Save</button>
        </div>

        <div class="section">
          <button class="button" onclick="changeStatusFromDetails()" id="change-status-details-btn"></button>
        </div>
      </div>
    </div>
  </div>

  <div id="add-modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="search-modal-title"></h3>
      <div class="small" id="search-modal-subtitle"></div>

      <input
        id="search-input"
        class="input"
        type="text"
        oninput="renderSearchResults()"
      >

      <div id="search-results"></div>

      <div class="modal-actions">
        <button class="button" onclick="openManualModal()" id="manual-add-btn"></button>
        <button class="button" onclick="closeAddModal()" id="close-search-btn"></button>
      </div>
    </div>
  </div>

  <div id="manual-modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="manual-title"></h3>
      <div class="small" id="manual-subtitle"></div>

      <input id="manual-name" class="input" type="text">
      <input id="manual-creator" class="input" type="text">
      <input id="manual-cover" class="input" type="text">
      <textarea id="manual-description" class="textarea"></textarea>

      <div class="modal-actions">
        <button class="button" onclick="closeManualModal()" id="manual-cancel-btn"></button>
        <button class="button" onclick="saveManualItem()" id="manual-save-btn"></button>
      </div>
    </div>
  </div>

  <div id="profile-modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="profile-title">Профиль</h3>

      <input id="profile-username" class="input" placeholder="Username">
      <input id="profile-display-name" class="input" placeholder="Display name">

      <label style="display:flex;align-items:center;gap:8px;margin-top:10px;">
        <input type="checkbox" id="profile-public">
        <span id="profile-public-label">Public library</span>
      </label>

      <div class="modal-actions">
        <button class="button" onclick="closeProfileModal()" id="profile-close-btn">Close</button>
        <button class="button" onclick="saveProfile()" id="profile-save-btn">Save Profile</button>
      </div>
    </div>
  </div>

  <div id="status-modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="status-modal-title"></h3>

      <div class="modal-actions" style="flex-direction:column;align-items:stretch">
        <button class="button" onclick="setStatus('Planned')" id="status-planned"></button>
        <button class="button" onclick="setStatus('In progress')" id="status-in-progress"></button>
        <button class="button" onclick="setStatus('Done')" id="status-done"></button>
        <button class="button" onclick="setStatus('Dropped')" id="status-dropped"></button>
        <button class="button" onclick="closeStatusModal()" id="status-cancel"></button>
      </div>
    </div>
  </div>

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")

    }

    async function renderSearchResults() {
      const container = document.getElementById("search-results");
      const input = document.getElementById("search-input");

      if (!container || !input) return;

      const query = input.value.trim();
      container.innerHTML = "";

      if (!query) {
        container.innerHTML = `<div class="small">${escapeHtml(t().labels.noResults)}</div>`;
        return;
      }

      if (currentCategory === "Books") {
        container.innerHTML = `<div class="small">${escapeHtml(t().labels.searching)}</div>`;

        try {
          let items = [];
          const tried = new Set();

          async function fetchBooks(url) {
            if (tried.has(url)) return [];
            tried.add(url);

            const response = await fetch(url);
            if (!response.ok) {
              throw new Error("HTTP " + response.status);
            }

            const data = await response.json();
            return data.docs || [];
          }

          const normalizedQuery = query.replace(/\s+/g, " ").trim();

          const generalUrl =
            "https://openlibrary.org/search.json?q=" +
            encodeURIComponent(normalizedQuery) +
            "&limit=10";

          items = await fetchBooks(generalUrl);

          if (items.length === 0) {
            const titleUrl =
              "https://openlibrary.org/search.json?title=" +
              encodeURIComponent(normalizedQuery) +
              "&limit=10";

            items = await fetchBooks(titleUrl);
          }

          if (items.length === 0) {
            const authorUrl =
              "https://openlibrary.org/search.json?author=" +
              encodeURIComponent(normalizedQuery) +
              "&limit=10";

            items = await fetchBooks(authorUrl);
          }

          if (items.length === 0) {
            const words = normalizedQuery.split(" ").filter(Boolean);

            if (words.length >= 2) {
              const firstHalf = words.slice(0, Math.ceil(words.length / 2)).join(" ");
              const secondHalf = words.slice(Math.ceil(words.length / 2)).join(" ");

              const comboUrl1 =
                "https://openlibrary.org/search.json?title=" +
                encodeURIComponent(firstHalf) +
                "&author=" +
                encodeURIComponent(secondHalf) +
                "&limit=10";

              items = await fetchBooks(comboUrl1);

              if (items.length === 0) {
                const comboUrl2 =
                  "https://openlibrary.org/search.json?title=" +
                  encodeURIComponent(secondHalf) +
                  "&author=" +
                  encodeURIComponent(firstHalf) +
                  "&limit=10";

                items = await fetchBooks(comboUrl2);
              }
            }
          }

          if (items.length === 0) {
            currentBookResults = [];
            container.innerHTML = `
              <div class="small">${escapeHtml(t().labels.noBooksFound)}</div>
              <div class="modal-actions" style="justify-content:flex-start;margin-top:12px;">
                <button class="button" onclick="openManualModal()">${escapeHtml(t().buttons.manualAdd)}</button>
              </div>
            `;
            return;
          }

          currentBookResults = items;
          container.innerHTML = "";

          items.forEach(function (book, index) {
            const title = book.title || "Untitled";
            const authors = (book.author_name || []).join(", ");
            const year = book.first_publish_year ? " • " + book.first_publish_year : "";

            const row = document.createElement("div");
            row.className = "search-item";
            row.innerHTML = `
              <div class="search-item-left">
                <div class="search-item-title">${escapeHtml(title)}</div>
                <div class="search-item-meta">${escapeHtml(authors || "Book")}${escapeHtml(year)}</div>
              </div>
              <button class="button" onclick="addOpenLibraryBookResult(${index})">${escapeHtml(t().buttons.add)}</button>
            `;
            container.appendChild(row);
          });

          return;
        } catch (error) {
          console.error("Open Library API error:", error);
          currentBookResults = [];
          container.innerHTML = `
            <div class="small">${escapeHtml(t().labels.apiError)}: ${escapeHtml(error.message)}</div>
            <div class="modal-actions" style="justify-content:flex-start;margin-top:12px;">
              <button class="button" onclick="openManualModal()">${escapeHtml(t().buttons.manualAdd)}</button>
            </div>
          `;
          return;
        }
      }

      container.innerHTML = `
        <div class="small">${escapeHtml(t().labels.noResults)}</div>
        <div class="modal-actions" style="justify-content:flex-start;margin-top:12px;">
          <button class="button" onclick="openManualModal()">${escapeHtml(t().buttons.manualAdd)}</button>
        </div>
      `;
    }

    async function fetchOpenLibraryDescription(workKey){
      if(!workKey) return "";

      try {
        const cleanKey = workKey.startsWith("/works/") ? workKey : `/works/${workKey}`;
        const workUrl = "https://openlibrary.org" + cleanKey + ".json";

        const workResponse = await fetch(workUrl);
        if(!workResponse.ok){
          throw new Error("HTTP " + workResponse.status);
        }

        const workData = await workResponse.json();

        function extractDescription(obj){
          if(!obj) return "";
          if(typeof obj.description === "string") return obj.description.trim();
          if(obj.description && typeof obj.description.value === "string") return obj.description.value.trim();
          return "";
        }

        const targetLangKey =
          currentLanguage === "ru"
            ? "/languages/rus"
            : currentLanguage === "en"
              ? "/languages/eng"
              : "";

        if(targetLangKey){
          const editionsUrl = "https://openlibrary.org" + cleanKey + "/editions.json?limit=20";
          const editionsResponse = await fetch(editionsUrl);

          if(editionsResponse.ok){
            const editionsData = await editionsResponse.json();
            const entries = Array.isArray(editionsData.entries)
              ? editionsData.entries
              : Array.isArray(editionsData.docs)
                ? editionsData.docs
                : [];

            for(const edition of entries){
              const languages = Array.isArray(edition.languages) ? edition.languages : [];
              const hasTargetLanguage = languages.some(lang => {
                if (!lang) return false;
                if (typeof lang === "string") return lang === targetLangKey;
                return lang.key === targetLangKey;
              });

              if(!hasTargetLanguage) continue;

              const editionDescription = extractDescription(edition);
              if(editionDescription){
                return editionDescription;
              }

              const editionKey = edition.key || "";
              if(!editionKey) continue;

              const editionUrl = "https://openlibrary.org" + editionKey + ".json";
              const editionResponse = await fetch(editionUrl);
              if(!editionResponse.ok) continue;

              const editionData = await editionResponse.json();
              const fullEditionDescription = extractDescription(editionData);

              if(fullEditionDescription){
                return fullEditionDescription;
              }
            }
          }
        }

        return extractDescription(workData);
      } catch (error) {
        console.error("Open Library description error:", error);
        return "";
      }
    }

    function isDuplicateItem(category, title, workKey = ""){
      const items = demoData[category] || [];

      return items.some(item => {
        if(workKey && item.work_key && item.work_key === workKey){
          return true;
        }

        return (item.title || "").trim().toLowerCase() === title.trim().toLowerCase();
      });
    }

    async function existsInSupabase(category, title, workKey = ""){
      const { data: authData, error: authError } = await supabaseClient.auth.getUser();

      if(authError || !authData.user){
        return false;
      }

      let query = supabaseClient
        .from("user_media")
        .select("id, title, work_key")
        .eq("user_id", authData.user.id)
        .eq("category", category)
        .limit(10);

      if(workKey){
        query = query.eq("work_key", workKey);
      } else {
        query = query.ilike("title", title);
      }

      const { data, error } = await query;

      if(error){
        console.error("Supabase duplicate check error:", error);
        return false;
      }

      return Array.isArray(data) && data.length > 0;
    }

    function looksLikeRussian(text){
  if(!text) return false;

  const letters = text.match(/[A-Za-zА-Яа-яЁё]/g) || [];
  if(letters.length < 20) return false;

  const cyrillic = text.match(/[А-Яа-яЁё]/g) || [];

  return (cyrillic.length / letters.length) >= 0.6;
}

function looksLikeEnglish(text){
  if(!text) return false;

  const letters = text.match(/[A-Za-zА-Яа-яЁё]/g) || [];
  if(letters.length < 20) return false;

  const latin = text.match(/[A-Za-z]/g) || [];

  return (latin.length / letters.length) >= 0.6;
}

    async function fetchGoogleBooksDescription(title, author = ""){
  try {
    const targetLang = currentLanguage === "ru" ? "ru" : "en";

    let query = "";
    if(title && author){
      query = intitle:${title} inauthor:${author};
    } else if(title){
      query = intitle:${title};
    } else if(author){
      query = inauthor:${author};
    } else {
      return { text: "", matchedLanguage: false };
    }

    async function tryRequest(url){
      const response = await fetch(url);

      if(!response.ok){
        throw new Error("HTTP " + response.status);
      }

      const data = await response.json();
      const items = data.items || [];

      for(const book of items){
        const info = book.volumeInfo || {};
        const description = info.description || "";

        if(!description){
          continue;
        }

        if(targetLang === "ru" && looksLikeRussian(description)){
          return { text: description, matchedLanguage: true };
        }

        if(targetLang === "en" && looksLikeEnglish(description)){
          return { text: description, matchedLanguage: true };
        }
      }

      for(const book of items){
        const info = book.volumeInfo || {};
        const description = info.description || "";

        if(description){
          return { text: description, matchedLanguage: false };
        }
      }

      return { text: "", matchedLanguage: false };
    }

    const strictUrl =
      "https://www.googleapis.com/books/v1/volumes?q=" +
      encodeURIComponent(query) +
      "&langRestrict=" + encodeURIComponent(targetLang) +
      "&maxResults=5" +
      "&key=" + encodeURIComponent(GOOGLE_BOOKS_API_KEY);

    let result = await tryRequest(strictUrl);

    if(result.text){
      return result;
    }

    const fallbackUrl =
      "https://www.googleapis.com/books/v1/volumes?q=" +
      encodeURIComponent(query) +
      "&maxResults=5" +
      "&key=" + encodeURIComponent(GOOGLE_BOOKS_API_KEY);

    result = await tryRequest(fallbackUrl);

    return result;
  } catch (error) {
    console.error("Google Books description error:", error);
    return { text: "", matchedLanguage: false };
  }
}
    
    async function openCard(title){
  currentOpenTitle = title;

  const item = (demoData[currentCategory] || []).find(x => x.title === title);

  hideAllScreens();
  document.getElementById("details-screen").classList.remove("hidden");

  document.getElementById("details-title").textContent = title;
  document.getElementById("details-creator").textContent = item?.creator || "";
  document.getElementById("details-category").textContent = translateCategory(currentCategory);
  document.getElementById("details-status").textContent = item ? translateStatus(item.status) : "Unknown";

  const coverBox = document.getElementById("details-cover-box");

  if(item && item.cover){
    coverBox.innerHTML = <img src="${escapeHtml(item.cover)}" alt="${escapeHtml(title)}">;
  } else {
    coverBox.textContent = t().labels.cover;
  }

  const descriptionEl = document.getElementById("details-description");

  const hasCurrentLanguageDescription =
    (currentLanguage === "ru" && item?.description_ru) ||
    (currentLanguage === "en" && item?.description_en);

  if(hasCurrentLanguageDescription){
    descriptionEl.textContent = getBestDescription(item);
  } else {
    descriptionEl.textContent = t().labels.searching;

    let fetchedDescription = "";
    let matchedLanguage = false;

    if(item && item.work_key){
      fetchedDescription = await fetchOpenLibraryDescription(item.work_key);

      if(fetchedDescription){
        if(currentLanguage === "ru" && looksLikeRussian(fetchedDescription)){
          matchedLanguage = true;
        }

        if(currentLanguage === "en" && looksLikeEnglish(fetchedDescription)){
          matchedLanguage = true;
        }
      }
    }

    if(!fetchedDescription){
      const googleResult = await fetchGoogleBooksDescription(
        item?.title || title,
        item?.creator || ""
      );

      fetchedDescription = googleResult.text || "";
      matchedLanguage = googleResult.matchedLanguage || false;
    }

    if(fetchedDescription){
      item.description = fetchedDescription;

      if(matchedLanguage){
        if(currentLanguage === "ru"){
          item.description_ru = fetchedDescription;
        }

        if(currentLanguage === "en"){
          item.description_en = fetchedDescription;
        }
      }

      descriptionEl.textContent = getBestDescription(item) || fetchedDescription;

      detailsDatabase[title] = {
        description: item.description || fetchedDescription
      };

      if(!isPublicView){
        await updateDescriptionInSupabase(
          title,
          currentCategory,
          fetchedDescription,
          matchedLanguage
        );
      }
    } else {
      descriptionEl.textContent = getBestDescription(item) || t().labels.noDescription;
    }
  }

  const canonicalSection = document.getElementById("canonical-key-section");
  const canonicalInput = document.getElementById("canonical-key-input");

  if(canonicalInput && canonicalSection){
    if(isPublicView){
      canonicalSection.classList.add("hidden");
    } else {
      canonicalSection.classList.remove("hidden");
      canonicalInput.value = item?.canonical_key || "";
    }
  }

  const statusBtn = document.getElementById("change-status-details-btn");

  if(statusBtn){
    if(isPublicView){
      statusBtn.classList.add("hidden");
    } else {
      statusBtn.classList.remove("hidden");
    }
  }
}

    async function saveItemToSupabase(
      title,
      category,
      status,
      cover = "",
      description = "",
      creator = "",
      workKey = "",
      canonicalKey = ""
    ){
      const { data: authData, error: authError } = await supabaseClient.auth.getUser();

      if(authError || !authData.user){
        alert(t().labels.mustBeLoggedIn);
        return false;
      }

      const finalCanonicalKey =
        canonicalKey ||
        workKey ||
        title.trim().toLowerCase();

      const insertData = {
        user_id: authData.user.id,
        title: title,
        category: category,
        status: status,
        cover_url: cover,
        description: description,
        creator: creator,
        work_key: workKey,
        canonical_key: finalCanonicalKey
      };

      if(currentLanguage === "ru" && description){
        insertData.description_ru = description;
      }

      if(currentLanguage === "en" && description){
        insertData.description_en = description;
      }

      const { error } = await supabaseClient
        .from("user_media")
        .insert([insertData]);

      if(error){
        console.error("Supabase insert error:", error);
        alert(t().labels.dbSaveError + ": " + error.message);
        return false;
      }

      return true;
    }

    async function updateDescriptionInSupabase(title, category, description, matchedLanguage = false){
  if(!description) return false;

  const updateData = {
    description: description
  };

  if(matchedLanguage){
    if(currentLanguage === "ru"){
      updateData.description_ru = description;
    }

    if(currentLanguage === "en"){
      updateData.description_en = description;
    }
  }

  const { error } = await supabaseClient
    .from("user_media")
    .update(updateData)
    .eq("title", title)
    .eq("category", category);

  if(error){
    console.error("Supabase description update error:", error);
    return false;
  }

  return true;
}

    async function loadCategoryFromSupabase(category){
      const { data: authData, error: authError } = await supabaseClient.auth.getUser();

      if(authError || !authData.user){
        console.error("Auth load error:", authError);
        demoData[category] = [];
        renderShelf();
        return;
      }

      const { data, error } = await supabaseClient
        .from("user_media")
        .select("*")
        .eq("user_id", authData.user.id)
        .eq("category", category)
        .order("id", { ascending: false });

      if(error){
        console.error("Supabase load error:", error);
        demoData[category] = [];
        renderShelf();
        return;
      }

      demoData[category] = [];
      const seen = new Set();

      data.forEach(item => {
        const dedupeKey =
          item.canonical_key ||
          item.work_key ||
          (item.title || "").trim().toLowerCase();

        if(seen.has(dedupeKey)){
          return;
        }

        seen.add(dedupeKey);

        demoData[category].push({
          title: item.title,
          status: item.status,
          cover: item.cover_url || "",
          description: item.description || "",
          description_ru: item.description_ru || "",
          description_en: item.description_en || "",
          creator: item.creator || "",
          work_key: item.work_key || "",
          canonical_key: item.canonical_key || ""
        });

        detailsDatabase[item.title] = {
          description: item.description || t().labels.noDescription
        };
      });

      renderShelf();
    }

    async function register(){
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;

      const { error } = await supabaseClient.auth.signUp({
        email: email,
        password: password
      });

      if(error){
        alert(error.message);
        return;
      }

      alert(t().labels.userCreatedCheckEmail);
    }

    async function login(){
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;

      const { error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

      if(error){
        alert(error.message);
        return;
      }

      document.getElementById("auth-screen").classList.add("hidden");
      document.getElementById("home-screen").classList.remove("hidden");

      const loginBtn = document.getElementById("login-top-btn");
      const logoutBtn = document.getElementById("logout-top-btn");
      const profileBtn = document.getElementById("profile-btn");

      if(loginBtn) loginBtn.classList.add("hidden");
      if(logoutBtn) logoutBtn.classList.remove("hidden");
      if(profileBtn) profileBtn.classList.remove("hidden");

      await loadProfile();
    }

    async function logout(){
      await supabaseClient.auth.signOut();
      location.reload();
    }

    async function checkAuth(){
      const { data } = await supabaseClient.auth.getUser();

      const loginBtn = document.getElementById("login-top-btn");
      const logoutBtn = document.getElementById("logout-top-btn");
      const profileBtn = document.getElementById("profile-btn");

      if(!data.user){
        document.getElementById("auth-screen").classList.remove("hidden");
        document.getElementById("home-screen").classList.add("hidden");

        if(loginBtn) loginBtn.classList.remove("hidden");
        if(logoutBtn) logoutBtn.classList.add("hidden");
        if(profileBtn) profileBtn.classList.add("hidden");
      } else {
        document.getElementById("auth-screen").classList.add("hidden");
        document.getElementById("home-screen").classList.remove("hidden");

        if(loginBtn) loginBtn.classList.add("hidden");
        if(logoutBtn) logoutBtn.classList.remove("hidden");
        if(profileBtn) profileBtn.classList.remove("hidden");

        await loadProfile();
      }
    }

    function openProfileModal(){
      document.getElementById("profile-modal").classList.remove("hidden");
    }

    function closeProfileModal(){
      document.getElementById("profile-modal").classList.add("hidden");
    }

    function showAuthScreen(){
      hideAllScreens();
      document.getElementById("auth-screen").classList.remove("hidden");
    }

    async function saveProfile(){
      const username = document.getElementById("profile-username").value.trim();
      const displayName = document.getElementById("profile-display-name").value.trim();
      const isPublic = document.getElementById("profile-public").checked;

      const { data: authData, error: authError } = await supabaseClient.auth.getUser();

      if(authError || !authData.user){
        alert(t().labels.mustBeLoggedIn);
        return;
      }

      const { error } = await supabaseClient
        .from("profiles")
        .upsert({
          id: authData.user.id,
          username: username || null,
          display_name: displayName || null,
          is_public: isPublic
        });

      if(error){
        alert(error.message);
        return;
      }

      closeProfileModal();
      alert(t().profile.saved);
    }

    async function loadProfile(){
      const { data: authData, error: authError } = await supabaseClient.auth.getUser();

      if(authError || !authData.user){
        return;
      }

      const { data, error } = await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", authData.user.id)
        .single();

      if(error || !data){
        return;
      }

      const usernameInput = document.getElementById("profile-username");
      const displayNameInput = document.getElementById("profile-display-name");
      const publicInput = document.getElementById("profile-public");

      if(usernameInput) usernameInput.value = data.username || "";
      if(displayNameInput) displayNameInput.value = data.display_name || "";
      if(publicInput) publicInput.checked = data.is_public !== false;
    }

    function openPublicCategory(name, profileName = "Library"){
      if(!isPublicView){
        return;
      }

      currentCategory = name;

      hideAllScreens();
      document.getElementById("category-screen").classList.remove("hidden");

      const addBtn = document.getElementById("add-new-btn");
      if(addBtn){
        addBtn.classList.add("hidden");
        addBtn.style.display = "none";
      }

      const tabs = document.getElementById("public-category-tabs");
      if(tabs){
        tabs.classList.remove("hidden");
        tabs.style.display = "flex";
      }

      document.getElementById("category-title").textContent =
        profileName + " — " + translateCategory(name);

      renderShelf();
    }

    async function loadPublicLibrary(username){
      const { data: profile, error: profileError } = await supabaseClient
        .from("profiles")
        .select("id, username, display_name, is_public")
        .eq("username", username)
        .maybeSingle();

      if(profileError){
        console.error(profileError);
        alert(t().labels.profileLookupError);
        return false;
      }

      if(!profile){
        alert(t().labels.userNotFound);
        return false;
      }

      if(profile.is_public === false){
        alert(t().labels.libraryPrivate);
        return false;
      }

      const { data, error } = await supabaseClient
        .from("user_media")
        .select("*")
        .eq("user_id", profile.id)
        .order("id", { ascending: false });

      if(error){
        console.error(error);
        return false;
      }

      isPublicView = true;

      currentPublicProfileName =
        profile.display_name || profile.username || "Library";

      demoData.Books = [];
      demoData.Movies = [];
      demoData.Series = [];
      demoData.Anime = [];
      demoData.Manga = [];
      demoData.Blacklist = [];

      const seen = new Set();

      data.forEach(item => {
        const dedupeKey =
          item.canonical_key ||
          item.work_key ||
          (item.title || "").trim().toLowerCase();

        const fullKey = `${item.category}:${dedupeKey}`;

        if(seen.has(fullKey)){
          return;
        }

        seen.add(fullKey);

        if(!demoData[item.category]){
          demoData[item.category] = [];
        }

        demoData[item.category].push({
          title: item.title,
          status: item.status,
          cover: item.cover_url || "",
          description: item.description || "",
          description_ru: item.description_ru || "",
          description_en: item.description_en || "",
          creator: item.creator || "",
          work_key: item.work_key || "",
          canonical_key: item.canonical_key || ""
        });

        detailsDatabase[item.title] = {
          description: item.description || t().labels.noDescription
        };
      });

      hideAllScreens();
      document.getElementById("category-screen").classList.remove("hidden");

      const addBtn = document.getElementById("add-new-btn");
      if(addBtn){
        addBtn.classList.add("hidden");
        addBtn.style.display = "none";
      }

      const tabs = document.getElementById("public-category-tabs");
      if(tabs){
        tabs.classList.remove("hidden");
        tabs.style.display = "flex";
      }

      currentCategory = "Books";

      document.getElementById("category-title").textContent =
        currentPublicProfileName + " — " + translateCategory("Books");

      renderShelf();
      return true;
    }

    async function checkPublicRoute(){
      const path = window.location.pathname;

      if(path.startsWith("/u/")){
        const username = path.replace("/u/", "").trim();

        if(username){
          return await loadPublicLibrary(username);
        }
      }

      return false;
    }

    async function shareLibrary(){
      const { data: authData } = await supabaseClient.auth.getUser();

      if(!authData.user){
        alert(t().labels.mustBeLoggedIn);
        return;
      }

      const { data, error } = await supabaseClient
        .from("profiles")
        .select("username")
        .eq("id", authData.user.id)
        .single();

      if(error || !data?.username){
        alert(t().labels.setUsernameFirst);
        return;
      }

      const url = window.location.origin + "/u/" + data.username;

      try {
        await navigator.clipboard.writeText(url);
        alert(t().labels.libraryLinkCopied + "\n" + url);
      } catch (e) {
        prompt(t().labels.libraryLinkCopied, url);
      }
    }

    async function init(){
      applyTranslations();
      const openedPublic = await checkPublicRoute();

      if(!openedPublic){
        await checkAuth();
      }
    }

    init();
  </script>

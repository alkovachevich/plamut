<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plamut</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#111;
  color:white;
  margin:0;
  padding:30px;
}

h1,h2,h3{
  margin-top:0;
}

.subtitle{
  color:#888;
  margin-bottom:30px;
}

.hidden{
  display:none;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:20px;
  max-width:1000px;
}

.card{
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:14px;
  padding:20px;
  text-align:center;
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  background:#222;
}

.topbar{
  display:flex;
  gap:12px;
  align-items:center;
  margin-bottom:24px;
  flex-wrap:wrap;
}

.button{
  background:#2a2a2a;
  color:white;
  border:1px solid #444;
  border-radius:10px;
  padding:10px 14px;
  cursor:pointer;
}

.button:hover{
  background:#333;
}

.shelf{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:18px;
  max-width:1100px;
}

.media-card{
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:14px;
  overflow:hidden;
}

.media-cover{
  height:220px;
  background:#2b2b2b;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#999;
  font-size:14px;
}

.media-info{
  padding:14px;
}

.media-title{
  font-size:16px;
  margin:0 0 8px 0;
}

.media-status{
  font-size:13px;
  color:#aaa;
  margin-bottom:12px;
}

.media-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.add-btn{
  background:#3a3a3a;
  color:white;
  border:none;
  border-radius:8px;
  padding:8px 10px;
  cursor:pointer;
}

.add-btn:hover{
  background:#4a4a4a;
}
</style>
</head>

<body>

<div id="home-screen">
  <h1>Plamut</h1>
  <div class="subtitle">Personal Library and Media Universe Tracker</div>

  <div class="grid">
    <div class="card" onclick="openCategory('Books')">📚 Books</div>
    <div class="card" onclick="openCategory('Movies')">🎬 Movies</div>
    <div class="card" onclick="openCategory('Series')">📺 Series</div>
    <div class="card" onclick="openCategory('Games')">🎮 Games</div>
    <div class="card" onclick="openCategory('Anime')">🍥 Anime</div>
    <div class="card" onclick="openCategory('Manga')">📖 Manga</div>
    <div class="card" onclick="openCategory('Blacklist')">🚫 Blacklist</div>
  </div>
</div>

<div id="category-screen" class="hidden">
  <div class="topbar">
    <button class="button" onclick="goHome()">← Back</button>
    <h2 id="category-title" style="margin:0;"></h2>
    <button class="button" onclick="addNew()">+ Add new</button>
  </div>

  <div class="shelf" id="shelf"></div>
</div>

<script>
const demoData = {
  Books: [
    { title: "Dune", status: "Planned" },
    { title: "Foundation", status: "In progress" },
    { title: "Neuromancer", status: "Done" }
  ],
  Movies: [
    { title: "Dune (2021)", status: "Done" },
    { title: "Blade Runner", status: "Planned" },
    { title: "Arrival", status: "Done" }
  ],
  Series: [
    { title: "Severance", status: "In progress" },
    { title: "Dark", status: "Done" }
  ],
  Games: [
    { title: "Cyberpunk 2077", status: "In progress" },
    { title: "The Witcher 3", status: "Done" }
  ],
  Anime: [
    { title: "Cowboy Bebop", status: "Done" },
    { title: "Monster", status: "Planned" }
  ],
  Manga: [
    { title: "Berserk", status: "In progress" },
    { title: "20th Century Boys", status: "Planned" }
  ],
  Blacklist: [
    { title: "Ignored creators will be here", status: "Info" }
  ]
};

function openCategory(name){
  document.getElementById("home-screen").classList.add("hidden");
  document.getElementById("category-screen").classList.remove("hidden");
  document.getElementById("category-title").textContent = name;

  const shelf = document.getElementById("shelf");
  shelf.innerHTML = "";

  const items = demoData[name] || [];

  items.forEach(item => {
    const card = document.createElement("div");
    card.className = "media-card";
    card.innerHTML = `
      <div class="media-cover">Cover</div>
      <div class="media-info">
        <h3 class="media-title">${item.title}</h3>
        <div class="media-status">Status: ${item.status}</div>
        <div class="media-actions">
          <button class="add-btn" onclick="changeStatus('${item.title}')">Change status</button>
          <button class="add-btn" onclick="openCard('${item.title}')">Open</button>
        </div>
      </div>
    `;
    shelf.appendChild(card);
  });
}

function goHome(){
  document.getElementById("category-screen").classList.add("hidden");
  document.getElementById("home-screen").classList.remove("hidden");
}

function addNew(){
  alert("Here will be search and quick add.");
}

function changeStatus(title){
  alert("Change status for: " + title);
}

function openCard(title){
  alert("Open media card: " + title);
}
</script>

</body>
</html>

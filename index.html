<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plamut</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      margin: 0;
      padding: 40px;
    }
    h1 {
      margin-bottom: 8px;
    }
    p {
      color: #bbb;
      margin-bottom: 24px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      max-width: 900px;
    }
    .card {
      background: #1b1b1b;
      border: 1px solid #2a2a2a;
      border-radius: 14px;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Plamut</h1>
  <p>Personal Library and Media Universe Tracker</p>

  <div class="grid">
    <div class="card">Books</div>
    <div class="card">Movies</div>
    <div class="card">Series</div>
    <div class="card">Games</div>
    <div class="card">Anime</div>
    <div class="card">Manga</div>
    <div class="card">Blacklist</div>
  </div>
</body>
</html>

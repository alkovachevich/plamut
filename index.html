<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plamut</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#111;
      color:white;
      margin:0;
      padding:30px;
    }

    h1,h2,h3{
      margin-top:0;
    }

    .subtitle{
      color:#888;
      margin-bottom:30px;
    }

    .hidden{
      display:none !important;
    }

    .top-right{
      display:flex;
      justify-content:flex-end;
      margin-bottom:20px;
    }

    .lang-switch{
      display:flex;
      gap:8px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
      gap:20px;
      max-width:1000px;
    }

    .card{
      background:#1a1a1a;
      border:1px solid #333;
      border-radius:14px;
      padding:20px;
      text-align:center;
      cursor:pointer;
      transition:.2s;
    }

    .card:hover{
      background:#222;
    }

    .topbar{
      display:flex;
      gap:12px;
      align-items:center;
      margin-bottom:24px;
      flex-wrap:wrap;
    }

    .button{
      background:#2a2a2a;
      color:white;
      border:1px solid #444;
      border-radius:10px;
      padding:10px 14px;
      cursor:pointer;
    }

    .button:hover{
      background:#333;
    }

    .shelf{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
      gap:18px;
      max-width:1100px;
    }

    .media-card{
      background:#1a1a1a;
      border:1px solid #333;
      border-radius:14px;
      overflow:hidden;
    }

    .media-cover{
      height:220px;
      background:#2b2b2b;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#999;
      font-size:14px;
    }

    .media-info{
      padding:14px;
    }

    .media-title{
      font-size:16px;
      margin:0 0 8px 0;
    }

    .media-status{
      font-size:13px;
      color:#aaa;
      margin-bottom:12px;
    }

    .media-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .add-btn{
      background:#3a3a3a;
      color:white;
      border:none;
      border-radius:8px;
      padding:8px 10px;
      cursor:pointer;
    }

    .add-btn:hover{
      background:#4a4a4a;
    }

    .modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.7);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      z-index:1000;
    }

    .modal-box{
      width:100%;
      max-width:420px;
      background:#1a1a1a;
      border:1px solid #333;
      border-radius:16px;
      padding:20px;
    }

    .modal-box h3{
      margin-top:0;
    }

    .input{
      width:100%;
      box-sizing:border-box;
      background:#111;
      color:white;
      border:1px solid #444;
      border-radius:10px;
      padding:12px;
      margin-bottom:12px;
    }

    .modal-actions{
      display:flex;
      gap:10px;
      justify-content:flex-end;
      margin-top:8px;
    }

    .small{
      color:#888;
      font-size:13px;
      margin-bottom:14px;
    }

    .search-item{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border:1px solid #333;
      border-radius:10px;
      margin-bottom:10px;
      background:#141414;
    }

    .search-item-title{
      font-size:14px;
    }

    .search-item-meta{
      font-size:12px;
      color:#888;
      margin-top:4px;
    }

    .details-layout{
      display:grid;
      grid-template-columns:minmax(220px, 280px) 1fr;
      gap:24px;
      max-width:1100px;
    }

    .details-cover{
      background:#1a1a1a;
      border:1px solid #333;
      border-radius:16px;
      overflow:hidden;
    }

    .details-cover-box{
      height:380px;
      background:#2b2b2b;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#999;
    }

    .details-panel{
      background:#1a1a1a;
      border:1px solid #333;
      border-radius:16px;
      padding:20px;
    }

    .badge{
      display:inline-block;
      padding:6px 10px;
      border:1px solid #444;
      border-radius:999px;
      color:#bbb;
      font-size:12px;
      margin-right:8px;
      margin-bottom:8px;
    }

    .section{
      margin-top:24px;
    }

    .related-list{
      display:grid;
      gap:10px;
      margin-top:10px;
    }

    .related-item{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
      border:1px solid #333;
      border-radius:12px;
      padding:12px;
      background:#141414;
    }

    .muted{
      color:#999;
    }

    @media (max-width: 800px){
      .details-layout{
        grid-template-columns:1fr;
      }

      .details-cover-box{
        height:260px;
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

      <div class="card" onclick="openCategory('Anime')" id="cat-anime"></div>
      <div class="card" onclick="openCategory('Manga')" id="cat-manga"></div>
      <div class="card" onclick="openCategory('Blacklist')" id="cat-blacklist"></div>
    </div>
  </div>

  <div id="category-screen" class="hidden">
    <div class="topbar">
      <button class="button" onclick="goHome()" id="back-home-btn"></button>
      <h2 id="category-title" style="margin:0;"></h2>
      <button class="button" onclick="addNew()" id="add-new-btn"></button>
    </div>

    <div class="shelf" id="shelf"></div>
  </div>

  <div id="details-screen" class="hidden">
    <div class="topbar">
      <button class="button" onclick="backToCategory()" id="back-shelf-btn"></button>
      <button class="button" onclick="openUniverse()" id="explore-universe-btn"></button>
    </div>

    <div class="details-layout">
      <div class="details-cover">
        <div class="details-cover-box" id="cover-label"></div>
      </div>

      <div class="details-panel">
        <h2 id="details-title">Title</h2>

        <div>
          <span class="badge" id="details-category">Category</span>
          <span class="badge" id="details-status">Status</span>
        </div>

        <div class="section">
          <h3 id="description-label"></h3>
          <div class="muted" id="details-description"></div>
        </div>

        <div class="section">
          <button class="button" onclick="changeStatusFromDetails()" id="change-status-details-btn"></button>
        </div>

        <div class="section">
          <h3 id="related-label"></h3>
          <div class="related-list" id="related-list"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="add-modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="search-modal-title"></h3>
      <div class="small" id="search-modal-subtitle"></div>

      <input
        id="search-input"
        class="input"
        type="text"
        oninput="renderSearchResults()"

      <div id="search-results"></div>

      <div class="modal-actions">
        <button class="button" onclick="closeAddModal()" id="close-search-btn"></button>
      </div>
    </div>
  </div>

  <div id="status-modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="status-modal-title"></h3>

      <div class="modal-actions" style="flex-direction:column;align-items:stretch">
        <button class="button" onclick="setStatus('Planned')" id="status-planned"></button>
        <button class="button" onclick="setStatus('In progress')" id="status-in-progress"></button>
        <button class="button" onclick="setStatus('Done')" id="status-done"></button>
        <button class="button" onclick="setStatus('Dropped')" id="status-dropped"></button>
        <button class="button" onclick="closeStatusModal()" id="status-cancel"></button>
      </div>
    </div>
  </div>

  <div id="progress-modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="progress-title"></h3>

      <div class="modal-actions" style="flex-direction:column;align-items:stretch">

        <button class="button" onclick="openUniverseFromModal()" id="progress-universe"></button>
        <button class="button" onclick="closeProgressModal()" id="progress-close"></button>
      </div>
    </div>
  </div>

    function rerenderCurrentScreen() {
      if (!document.getElementById("category-screen").classList.contains("hidden") && currentCategory) {
        document.getElementById("category-title").textContent = translateCategory(currentCategory);
        renderShelf();
      }

      if (!document.getElementById("details-screen").classList.contains("hidden") && currentOpenTitle) {
        openCard(currentOpenTitle);
      }

      if (!document.getElementById("add-modal").classList.contains("hidden")) {
        renderSearchResults();
      }
    }

    function translateStatus(status) {
      return t().statuses[status] || status;
    }

    function translateCategory(category) {
      return t().categoryNames[category] || category;
    }

    function openCategory(name){
      currentCategory = name;
      hideAllScreens();
      document.getElementById("category-screen").classList.remove("hidden");
      document.getElementById("category-title").textContent = translateCategory(name);
      renderShelf();
    }

    function renderShelf(){
      const shelf = document.getElementById("shelf");
      shelf.innerHTML = "";

      const items = demoData[currentCategory] || [];

      items.forEach((item, index) => {
        const safeTitle = item.title.replace(/'/g, "\\'");
        const card = document.createElement("div");
        card.className = "media-card";
        card.innerHTML = `
          <div class="media-cover">${t().labels.cover}</div>
          <div class="media-info">
            <h3 class="media-title">${item.title}</h3>
            <div class="media-status">${t().labels.statusLabel}: ${translateStatus(item.status)}</div>
            <div class="media-actions">
              <button class="add-btn" onclick="changeStatus(${index})">${t().buttons.changeStatus}</button>
              <button class="add-btn" onclick="openCard('${safeTitle}')">${t().buttons.open}</button>
            </div>
          </div>
        `;
        shelf.appendChild(card);
      });
    }

    function hideAllScreens(){
      document.getElementById("home-screen").classList.add("hidden");
      document.getElementById("category-screen").classList.add("hidden");
      document.getElementById("details-screen").classList.add("hidden");
    }

    function goHome(){
      hideAllScreens();
      document.getElementById("home-screen").classList.remove("hidden");
    }

    function backToCategory(){
      hideAllScreens();
      document.getElementById("category-screen").classList.remove("hidden");
    }

    function addNew(){
      document.getElementById("add-modal").classList.remove("hidden");
      document.getElementById("search-input").value = "";
      renderSearchResults();
      document.getElementById("search-input").focus();
    }

    function closeAddModal(){
      document.getElementById("add-modal").classList.add("hidden");
    }

    function renderSearchResults(){

      const query = document.getElementById("search-input").value.trim().toLowerCase();

      container.innerHTML = "";

      const items = searchDatabase[currentCategory] || [];

      const filtered = items.filter(item =>
        item.title.toLowerCase().includes(query)
      );

      if(filtered.length === 0){
        container.innerHTML = `<div class="small">${t().labels.noResults}</div>`;
        return;
      }

      filtered.forEach(item => {
        const safeTitle = item.title.replace(/'/g, "\\'");
        const row = document.createElement("div");
        row.className = "search-item";
        row.innerHTML = `
          <div>
            <div class="search-item-title">${item.title}</div>
            <div class="search-item-meta">${translateCategory(currentCategory)}</div>
          </div>
          <button class="button" onclick="addSearchResult('${safeTitle}')">${t().buttons.add}</button>
        `;
        container.appendChild(row);
      });
    }

    async function addSearchResult(title){
  const exists = (demoData[currentCategory] || []).some(item => item.title === title);

  if(exists){
    alert(t().labels.alreadyExists);
    return;
  }

  const saved = await saveItemToSupabase(title, currentCategory, "Planned");

  if(!saved){
    return;
  }

  demoData[currentCategory].unshift({
    title: title,
    status: "Planned"
  });

  closeAddModal();
  renderShelf();
}
      }

      demoData[currentCategory].unshift({
        title: title,
        status: "Planned"
      });

      closeAddModal();
      renderShelf();
    }

    function changeStatus(index){
      currentStatusIndex = index;
      currentOpenTitle = demoData[currentCategory][index].title;
      document.getElementById("status-modal").classList.remove("hidden");
    }

    function changeStatusFromDetails(){
      const index = (demoData[currentCategory] || []).findIndex(item => item.title === currentOpenTitle);

      if(index === -1){
        alert(t().labels.itemNotFound);
        return;
      }

      currentStatusIndex = index;
      document.getElementById("status-modal").classList.remove("hidden");
    }

    function setStatus(status){
      demoData[currentCategory][currentStatusIndex].status = status;
      closeStatusModal();
      renderShelf();

      if(!document.getElementById("details-screen").classList.contains("hidden") && currentOpenTitle){
        openCard(currentOpenTitle);
      }

      if(status === "Done"){
        setTimeout(() => {
          document.getElementById("progress-modal").classList.remove("hidden");
        }, 200);
      }
    }

    function closeStatusModal(){
      document.getElementById("status-modal").classList.add("hidden");
    }

    function closeProgressModal(){
      document.getElementById("progress-modal").classList.add("hidden");
    }

    function openCard(title){
      currentOpenTitle = title;

      const item = (demoData[currentCategory] || []).find(x => x.title === title);
      const details = detailsDatabase[title] || {
        description: "No detailed description yet. This is a prototype card.",
        related: []
      };

      hideAllScreens();
      document.getElementById("details-screen").classList.remove("hidden");

      document.getElementById("details-title").textContent = title;
      document.getElementById("details-category").textContent = translateCategory(currentCategory);
      document.getElementById("details-status").textContent = item ? translateStatus(item.status) : "Unknown";
      document.getElementById("details-description").textContent = details.description;

      const relatedList = document.getElementById("related-list");
      relatedList.innerHTML = "";

      if(!details.related.length){
        relatedList.innerHTML = `<div class="muted">${t().labels.noRelated}</div>`;
        return;
      }

      details.related.forEach(name => {
        const safeName = name.replace(/'/g, "\\'");
        const row = document.createElement("div");
        row.className = "related-item";
        row.innerHTML = `
          <div>${name}</div>
          <button class="button" onclick="openRelatedPrototype('${safeName}')">${t().buttons.open}</button>
        `;
        relatedList.appendChild(row);
      });
    }

    function openRelatedPrototype(title){
      alert(title + "\n\n" + t().labels.relatedOpenLater);
    }

    function openUniverse(){
      alert(t().labels.universeLater);
    }

    function openUniverseFromModal(){
      closeProgressModal();
      openUniverse();
    }

    function openNextWork(){
      closeProgressModal();

      const nextTitle = nextWorksMap[currentOpenTitle];

      if(!nextTitle){
        alert("No next work mapped yet.");
        return;
      }

      const exists = (demoData[currentCategory] || []).some(item => item.title === nextTitle);

      if(!exists){
        demoData[currentCategory].unshift({
          title: nextTitle,
          status: "Planned"
        });
        renderShelf();
      }

      openCard(nextTitle);
    }
async function saveItemToSupabase(title, category, status){
  const { error } = await supabaseClient
    .from("user_media")
    .insert([
      {
        title: title,
        category: category,
        status: status
      }
    ]);

  if(error){
    console.error("Supabase insert error:", error);
    alert("Error saving item to database");
    return false;
  }

  return true;
}
    applyTranslations();
  </script>

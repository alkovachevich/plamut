<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plamut</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#111;
      color:white;
      margin:0;
      padding:30px;
    }

    h1,h2,h3{
      margin-top:0;
    }

    .subtitle{
      color:#888;
      margin-bottom:20px;
    }

    .hidden{
      display:none !important;
    }

    .top-right{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:20px;
    }

    .lang-switch{
      display:flex;
      gap:8px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
      gap:20px;
      max-width:1000px;
    }

    .card{
      background:#1a1a1a;
      border:1px solid #333;
      border-radius:14px;
      padding:20px;
      text-align:center;
      cursor:pointer;
      transition:.2s;
    }

    .card:hover{
      background:#222;
    }

    .topbar{
      display:flex;
      gap:12px;
      align-items:center;
      margin-bottom:18px;
      flex-wrap:wrap;
    }

    .toolbar-row{
      display:flex;
      gap:12px;
      align-items:center;
      margin-bottom:18px;
      flex-wrap:wrap;
    }

    .button{
      background:#2a2a2a;
      color:white;
      border:1px solid #444;
      border-radius:10px;
      padding:10px 14px;
      cursor:pointer;
    }

    .button:hover{
      background:#333;
    }

    .select{
      background:#111;
      color:white;
      border:1px solid #444;
      border-radius:10px;
      padding:10px 12px;
      font:inherit;
      min-width:180px;
    }

    .shelf{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
      gap:18px;
      max-width:1100px;
    }

    .media-card{
      background:#1a1a1a;
      border:1px solid #333;
      border-radius:14px;
      overflow:hidden;
    }

    .media-cover{
      height:220px;
      background:#2b2b2b;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#999;
      font-size:14px;
    }

    .media-cover img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .media-info{
      padding:14px;
    }

    .media-title{
      font-size:16px;
      margin:0 0 8px 0;
    }

    .media-meta{
      font-size:13px;
      color:#aaa;
      margin-bottom:8px;
    }

    .media-status{
      font-size:13px;
      color:#aaa;
      margin-bottom:12px;
    }

    .media-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .add-btn{
      background:#3a3a3a;
      color:white;
      border:none;
      border-radius:8px;
      padding:8px 10px;
      cursor:pointer;
    }

    .add-btn:hover{
      background:#4a4a4a;
    }

    .modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.7);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      z-index:1000;
    }

    .modal-box{
      width:100%;
      max-width:680px;
      background:#1a1a1a;
      border:1px solid #333;
      border-radius:16px;
      padding:20px;
      max-height:85vh;
      overflow:auto;
    }

    .input,
    .textarea{
      width:100%;
      box-sizing:border-box;
      background:#111;
      color:white;
      border:1px solid #444;
      border-radius:10px;
      padding:12px;
      margin-bottom:12px;
      font:inherit;
    }

    .textarea{
      min-height:120px;
      resize:vertical;
    }

    .modal-actions{
      display:flex;
      gap:10px;
      justify-content:flex-end;
      margin-top:8px;
      flex-wrap:wrap;
    }

    .small{
      color:#888;
      font-size:13px;
      margin-bottom:14px;
    }

    .search-item{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border:1px solid #333;
      border-radius:10px;
      margin-bottom:10px;
      background:#141414;
    }

    .search-item-left{
      min-width:0;
      display:flex;
      gap:12px;
      align-items:flex-start;
    }

    .search-thumb{
      width:50px;
      height:72px;
      flex:0 0 50px;
      background:#222;
      border-radius:8px;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#777;
      font-size:12px;
    }

    .search-thumb img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .search-item-text{
      min-width:0;
    }

    .search-item-title{
      font-size:14px;
      word-break:break-word;
      margin-bottom:4px;
    }

    .search-item-meta{
      font-size:12px;
      color:#888;
      margin-top:4px;
      word-break:break-word;
    }

    .details-layout{
      display:grid;
      grid-template-columns:minmax(220px, 280px) 1fr;
      gap:24px;
      max-width:1100px;
    }

    .details-cover{
      background:#1a1a1a;
      border:1px solid #333;
      border-radius:16px;
      overflow:hidden;
    }

    .details-cover-box{
      height:380px;
      background:#2b2b2b;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#999;
    }

    .details-cover-box img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .details-panel{
      background:#1a1a1a;
      border:1px solid #333;
      border-radius:16px;
      padding:20px;
    }

    .badge{
      display:inline-block;
      padding:6px 10px;
      border:1px solid #444;
      border-radius:999px;
      color:#bbb;
      font-size:12px;
      margin-right:8px;
      margin-bottom:8px;
    }

    .section{
      margin-top:24px;
    }

    .muted{
      color:#999;
      white-space:pre-wrap;
      word-break:break-word;
    }

    .global-search-box{
      max-width:1100px;
      margin-bottom:26px;
    }

    .global-filters{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-bottom:14px;
    }

    .global-results{
      display:grid;
      gap:10px;
    }

    .global-result-badge{
      display:inline-block;
      padding:4px 8px;
      border:1px solid #444;
      border-radius:999px;
      font-size:12px;
      color:#bbb;
      margin-bottom:6px;
    }

    @media (max-width: 800px){
      .details-layout{
        grid-template-columns:1fr;
      }

      .details-cover-box{
        height:260px;
      }

      .search-item{
        flex-direction:column;
        align-items:stretch;
      }

      .search-item-left{
        width:100%;
      }
    }
  </style>
</head>

<body>

  <div class="top-right">
    <div class="lang-switch">
      <button class="button" onclick="setLanguage('en')">EN</button>
      <button class="button" onclick="setLanguage('ru')">RU</button>
    </div>

    <div style="display:flex;gap:8px;align-items:center;">
      <button id="profile-btn" class="button hidden" onclick="openProfileModal()">Profile</button>
      <button id="login-top-btn" class="button hidden" onclick="showAuthScreen()">Login</button>
      <button id="logout-top-btn" class="button hidden" onclick="logout()">Logout</button>
    </div>
  </div>

  <div id="auth-screen">
    <h2>Plamut Login</h2>

    <input id="login-email" class="input" placeholder="Email">
    <input id="login-password" class="input" type="password" placeholder="Password">

    <div style="margin-top:10px;">
      <button class="button" onclick="login()">Login</button>
      <button class="button" onclick="register()">Register</button>
    </div>
  </div>

  <div id="home-screen" class="hidden">
    <h1>Plamut</h1>
    <div class="subtitle" id="home-subtitle"></div>

    <div class="global-search-box">
      <input id="global-search-input" class="input" type="text" placeholder="Search everything" oninput="renderGlobalSearch()">

      <div class="global-filters">
        <button class="button" onclick="setGlobalFilter('All')" id="global-filter-all">All</button>
        <button class="button" onclick="setGlobalFilter('Books')" id="global-filter-books">Books</button>
        <button class="button" onclick="setGlobalFilter('Movies')" id="global-filter-movies">Movies</button>
        <button class="button" onclick="setGlobalFilter('Series')" id="global-filter-series">Series</button>
        <button class="button" onclick="setGlobalFilter('Anime')" id="global-filter-anime">Anime</button>
        <button class="button" onclick="setGlobalFilter('Manga')" id="global-filter-manga">Manga</button>
      </div>

      <div id="global-search-results" class="global-results"></div>
    </div>

    <div class="grid">
      <div class="card" onclick="openCategory('Books')" id="cat-books"></div>
      <div class="card" onclick="openCategory('Movies')" id="cat-movies"></div>
      <div class="card" onclick="openCategory('Series')" id="cat-series"></div>
      <div class="card" onclick="openCategory('Anime')" id="cat-anime"></div>
      <div class="card" onclick="openCategory('Manga')" id="cat-manga"></div>
      <div class="card" onclick="openCategory('Blacklist')" id="cat-blacklist"></div>
    </div>

    <div style="margin-top:16px;">
      <button id="share-library-btn" class="button" onclick="shareLibrary()">Share Library</button>
    </div>
  </div>

  <div id="category-screen" class="hidden">
    <div class="topbar">
      <button class="button" onclick="goHome()" id="back-home-btn"></button>
      <h2 id="category-title" style="margin:0;"></h2>
      <button class="button" onclick="openAddModal()" id="add-new-btn"></button>
    </div>

    <div id="public-category-tabs" class="hidden" style="display:none;gap:8px;flex-wrap:wrap;margin-bottom:16px;">
      <button class="button" onclick="openPublicCategory('Books', currentPublicProfileName)" id="public-tab-books">Books</button>
      <button class="button" onclick="openPublicCategory('Movies', currentPublicProfileName)" id="public-tab-movies">Movies</button>
      <button class="button" onclick="openPublicCategory('Series', currentPublicProfileName)" id="public-tab-series">Series</button>
      <button class="button" onclick="openPublicCategory('Anime', currentPublicProfileName)" id="public-tab-anime">Anime</button>
      <button class="button" onclick="openPublicCategory('Manga', currentPublicProfileName)" id="public-tab-manga">Manga</button>
      <button class="button" onclick="openPublicCategory('Blacklist', currentPublicProfileName)" id="public-tab-blacklist">Blacklist</button>
    </div>

    <div class="toolbar-row" id="filter-toolbar">
      <label for="status-filter" id="status-filter-label"></label>
      <select id="status-filter" class="select" onchange="setStatusFilter(this.value)">
        <option value="All">All</option>
        <option value="Planned">Planned</option>
        <option value="In progress">In progress</option>
        <option value="Done">Done</option>
        <option value="Dropped">Dropped</option>
      </select>
    </div>

    <div class="shelf" id="shelf"></div>
  </div>

  <div id="details-screen" class="hidden">
    <div class="topbar">
      <button class="button" onclick="backToCategory()" id="back-shelf-btn"></button>
    </div>

    <div class="details-layout">
      <div class="details-cover">
        <div class="details-cover-box" id="details-cover-box"></div>
      </div>

      <div class="details-panel">
        <h2 id="details-title"></h2>
        <div class="muted" id="details-creator" style="margin-bottom:10px;"></div>

        <div>
          <span class="badge" id="details-category"></span>
          <span class="badge" id="details-status"></span>
        </div>

        <div class="section">
          <h3 id="description-label"></h3>
          <div class="muted" id="details-description"></div>
        </div>

        <div class="section" id="canonical-key-section">
          <h3>Canonical Key</h3>
          <input id="canonical-key-input" class="input" type="text">
          <button class="button" onclick="saveCanonicalKey()">Save</button>
        </div>

        <div class="section" style="display:flex;gap:10px;flex-wrap:wrap;">
          <button class="button" onclick="changeStatusFromDetails()" id="change-status-details-btn"></button>
          <button class="button" onclick="deleteCurrentItem()" id="delete-details-btn"></button>
        </div>
      </div>
    </div>
  </div>

  <div id="add-modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="search-modal-title"></h3>
      <div class="small" id="search-modal-subtitle"></div>

      <input
        id="search-input"
        class="input"
        type="text"
        oninput="renderCategorySearchResults()"
      >

      <div id="search-results"></div>

      <div class="modal-actions">
        <button class="button" onclick="openManualModal()" id="manual-add-btn"></button>
        <button class="button" onclick="closeAddModal()" id="close-search-btn"></button>
      </div>
    </div>
  </div>

  <div id="manual-modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="manual-title"></h3>
      <div class="small" id="manual-subtitle"></div>

      <input id="manual-name" class="input" type="text">
      <input id="manual-creator" class="input" type="text">
      <input id="manual-cover" class="input" type="text">
      <textarea id="manual-description" class="textarea"></textarea>

      <div class="modal-actions">
        <button class="button" onclick="closeManualModal()" id="manual-cancel-btn"></button>
        <button class="button" onclick="saveManualItem()" id="manual-save-btn"></button>
      </div>
    </div>
  </div>

  <div id="profile-modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="profile-title">Профиль</h3>

      <input id="profile-username" class="input" placeholder="Username">
      <input id="profile-display-name" class="input" placeholder="Display name">

      <label style="display:flex;align-items:center;gap:8px;margin-top:10px;">
        <input type="checkbox" id="profile-public">
        <span id="profile-public-label">Public library</span>
      </label>

      <div class="modal-actions">
        <button class="button" onclick="closeProfileModal()" id="profile-close-btn">Close</button>
        <button class="button" onclick="saveProfile()" id="profile-save-btn">Save Profile</button>
      </div>
    </div>
  </div>

  <div id="status-modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="status-modal-title"></h3>

      <div class="modal-actions" style="flex-direction:column;align-items:stretch">
        <button class="button" onclick="setStatus('Planned')" id="status-planned"></button>
        <button class="button" onclick="setStatus('In progress')" id="status-in-progress"></button>
        <button class="button" onclick="setStatus('Done')" id="status-done"></button>
        <button class="button" onclick="setStatus('Dropped')" id="status-dropped"></button>
        <button class="button" onclick="moveCurrentItemToBlacklist()" id="status-blacklist"></button>
        <button class="button" onclick="closeStatusModal()" id="status-cancel"></button>
      </div>
    </div>
  </div>

    async function translateText(text, fromLang, toLang){
      if(!text) return "";
      try {
        const url =
          "https://api.mymemory.translated.net/get?q=" +
          encodeURIComponent(text) +
          "&langpair=" +
          encodeURIComponent(fromLang + "|" + toLang);

        const data = await fetchJson(url);
        return data?.responseData?.translatedText || "";
      } catch (error) {
        console.error("Translation error:", error);
        return "";
      }
    }

    function buildCanonicalKey(category, source, rawId, title){
      if(rawId){

      return `${category}:${String(title || "").trim().toLowerCase()}`;
    }

    async function fetchOpenLibraryDescription(workKey, preferredLang = currentLanguage){
      if(!workKey) return { text: "", language: "" };

      try {
        const cleanKey = workKey.startsWith("/works/") ? workKey : `/works/${workKey}`;
        const workUrl = "https://openlibrary.org" + cleanKey + ".json";
        const workData = await fetchJson(workUrl);

        function extractDescription(obj){
          if(!obj) return "";
          if(typeof obj.description === "string") return obj.description.trim();
          if(obj.description && typeof obj.description.value === "string") return obj.description.value.trim();
          return "";
        }

        function detectLang(text){
          if(looksLikeRussian(text)) return "ru";
          if(looksLikeEnglish(text)) return "en";
          return "";
        }

        const workDescription = extractDescription(workData);
        const workLang = detectLang(workDescription);

        const targetLangKey = preferredLang === "ru" ? "/languages/rus" : "/languages/eng";
        const editionsUrl = "https://openlibrary.org" + cleanKey + "/editions.json?limit=30";

        try {
          const editionsData = await fetchJson(editionsUrl);
          const entries = Array.isArray(editionsData.entries)
            ? editionsData.entries
            : Array.isArray(editionsData.docs)
              ? editionsData.docs
              : [];

          for(const edition of entries){
            const languages = Array.isArray(edition.languages) ? edition.languages : [];
            const hasTargetLanguage = languages.some(lang => {
              if(!lang) return false;
              if(typeof lang === "string") return lang === targetLangKey;
              return lang.key === targetLangKey;
            });

            if(!hasTargetLanguage) continue;

            const editionDescription = extractDescription(edition);
            if(editionDescription){
              const lang = detectLang(editionDescription);
              return { text: editionDescription, language: lang };
            }

            const editionKey = edition.key || "";
            if(!editionKey) continue;

            try {
              const editionData = await fetchJson("https://openlibrary.org" + editionKey + ".json");
              const fullEditionDescription = extractDescription(editionData);
              if(fullEditionDescription){
                const lang = detectLang(fullEditionDescription);
                return { text: fullEditionDescription, language: lang };
              }
            } catch (e) {
              console.error("Edition description error:", e);
            }
          }
        } catch (e) {
          console.error("Open Library editions error:", e);
        }

        return { text: workDescription, language: workLang };
      } catch (error) {
        console.error("Open Library description error:", error);
        return { text: "", language: "" };
      }
    }

    async function fetchGoogleBooksDescription(title, author = "", preferredLang = currentLanguage){
      try {
        const targetLang = preferredLang === "ru" ? "ru" : "en";

        let query = "";
        if(title && author){
          query = `intitle:${title} inauthor:${author}`;
        } else if(title){
          query = `intitle:${title}`;
        } else if(author){
          query = `inauthor:${author}`;
        } else {
          return { text: "", language: "", matchedLanguage: false };
        }

        function detectLang(text){
          if(looksLikeRussian(text)) return "ru";
          if(looksLikeEnglish(text)) return "en";
          return "";
        }

        async function tryRequest(url){
          const data = await fetchJson(url);
          const items = data.items || [];

          for(const book of items){
            const info = book.volumeInfo || {};
            const description = info.description || "";
            if(!description) continue;

            const lang = detectLang(description);
            if(lang === targetLang){
              return { text: description, language: lang, matchedLanguage: true };
            }
          }

          for(const book of items){
            const info = book.volumeInfo || {};
            const description = info.description || "";
            if(description){
              const lang = detectLang(description);
              return { text: description, language: lang, matchedLanguage: false };
            }
          }

          return { text: "", language: "", matchedLanguage: false };
        }

        const strictUrl =
          "https://www.googleapis.com/books/v1/volumes?q=" +
          encodeURIComponent(query) +
          "&langRestrict=" + encodeURIComponent(targetLang) +
          "&maxResults=10" +
          "&key=" + encodeURIComponent(GOOGLE_BOOKS_API_KEY);

        let result = await tryRequest(strictUrl);
        if(result.text) return result;

        const fallbackUrl =
          "https://www.googleapis.com/books/v1/volumes?q=" +
          encodeURIComponent(query) +
          "&maxResults=10" +
          "&key=" + encodeURIComponent(GOOGLE_BOOKS_API_KEY);

        result = await tryRequest(fallbackUrl);
        return result;
      } catch (error) {
        console.error("Google Books description error:", error);
        return { text: "", language: "", matchedLanguage: false };
      }
    }

    async function buildBookDescriptions(title, author, workKey){
      let description = "";
      let description_ru = "";
      let description_en = "";

      const olCurrent = await fetchOpenLibraryDescription(workKey, currentLanguage);
      if(olCurrent.text){
        description = olCurrent.text;
        if(olCurrent.language === "ru") description_ru = olCurrent.text;
        if(olCurrent.language === "en") description_en = olCurrent.text;
      }

      if(!description_ru){
        const olRu = await fetchOpenLibraryDescription(workKey, "ru");
        if(olRu.text && looksLikeRussian(olRu.text)){
          description_ru = olRu.text;
          if(!description) description = olRu.text;
        }
      }

      if(!description_en){
        const olEn = await fetchOpenLibraryDescription(workKey, "en");
        if(olEn.text && looksLikeEnglish(olEn.text)){
          description_en = olEn.text;
          if(!description) description = olEn.text;
        }
      }

      if(!description_ru){
        const googleRu = await fetchGoogleBooksDescription(title, author, "ru");
        if(googleRu.text && looksLikeRussian(googleRu.text)){
          description_ru = googleRu.text;
          if(!description) description = googleRu.text;
        }
      }

      if(!description_en){
        const googleEn = await fetchGoogleBooksDescription(title, author, "en");
        if(googleEn.text && looksLikeEnglish(googleEn.text)){
          description_en = googleEn.text;
          if(!description) description = googleEn.text;
        }
      }

      if(!description_ru && description_en){
        const translatedRu = await translateTextToRussian(description_en);
        if(translatedRu && looksLikeRussian(translatedRu)){
          description_ru = translatedRu;
        }
      }

      if(!description_en && description_ru){
        const translatedEn = await translateTextToEnglish(description_ru);
        if(translatedEn && looksLikeEnglish(translatedEn)){
          description_en = translatedEn;
        }
      }

      if(!description){
        description = description_ru || description_en || "";
      }

      return {
        description: description || "",
        description_ru: description_ru || "",
        description_en: description_en || ""
      };
    }

    async function translateDescriptionFields(description){
      let description_ru = "";
      let description_en = "";
      if(looksLikeRussian(description)){
        description_ru = description;
        description_en = await translateTextToEnglish(description);
      } else if(looksLikeEnglish(description)){
        description_en = description;
        description_ru = await translateTextToRussian(description);
      }
      return {
        description: description || "",
        description_ru: description_ru || "",
        description_en: description_en || ""
      };
    }

    async function searchBooksApi(query, limit = 8){
      try {
        const url = "https://openlibrary.org/search.json?q=" + encodeURIComponent(query) + "&limit=" + limit;
        const data = await fetchJson(url);
        const docs = Array.isArray(data.docs) ? data.docs : [];

        return docs.map(book => {
          const workKey = book.key || "";
          const title = book.title || "Untitled";
          const creator = (book.author_name || []).join(", ");
          return {
            title,
            category: "Books",
            creator,
            cover: book.cover_i ? getOpenLibraryCoverUrl(book.cover_i) : "",
            description: "",
            description_ru: "",
            description_en: "",
            work_key: workKey,
            canonical_key: buildCanonicalKey("Books", "openlibrary", workKey || title.toLowerCase(), title)
          };
        });
      } catch (e) {
        console.error("Books search error:", e);
        return [];
      }
    }

    async function searchMoviesApi(query, mediaType = "movie", limit = 8){
      try {
        const url = "https://api.themoviedb.org/3/search/" + mediaType +
          "?api_key=" + encodeURIComponent(TMDB_API_KEY) +
          "&query=" + encodeURIComponent(query) +
          "&language=en-US&page=1";
        const data = await fetchJson(url);
        const results = Array.isArray(data.results) ? data.results : [];

        return results.slice(0, limit).map(item => {
          const title = mediaType === "tv" ? (item.name || "Untitled") : (item.title || "Untitled");
          const overview = item.overview || "";
          const category = mediaType === "tv" ? "Series" : "Movies";
          const externalId = String(item.id || "");
          return {
            title,
            category,
            creator: "",
            cover: item.poster_path ? ("https://image.tmdb.org/t/p/w500" + item.poster_path) : "",
            description: overview,
            description_ru: "",
            description_en: looksLikeEnglish(overview) ? overview : "",
            work_key: `tmdb:${mediaType}:${externalId}`,
            canonical_key: buildCanonicalKey(category, "tmdb", `${mediaType}:${externalId}`, title)
          };
        });
      } catch (e) {
        console.error("TMDb search error:", e);
        return [];
      }
    }

    async function searchJikanApi(query, kind = "anime", limit = 8){
      try {
        const url = "https://api.jikan.moe/v4/" + kind + "?q=" + encodeURIComponent(query) + "&limit=" + limit;
        const data = await fetchJson(url);
        const results = Array.isArray(data.data) ? data.data : [];

        return results.map(item => {
          const title = item.title || item.title_english || "Untitled";
          const creator =
            kind === "anime"
              ? ((item.studios || []).map(x => x.name).join(", "))
              : ((item.authors || []).map(x => x.name).join(", "));
          const synopsis = item.synopsis || "";
          const category = kind === "anime" ? "Anime" : "Manga";
          const externalId = String(item.mal_id || "");
          return {
            title,
            category,
            creator,
            cover: item.images?.jpg?.image_url || "",
            description: synopsis,
            description_ru: "",
            description_en: looksLikeEnglish(synopsis) ? synopsis : "",
            work_key: `jikan:${kind}:${externalId}`,
            canonical_key: buildCanonicalKey(category, "jikan", `${kind}:${externalId}`, title)
          };
        });
      } catch (e) {
        console.error("Jikan search error:", e);
        return [];
      }
    }

    async function searchAniListApi(query, kind = "ANIME", limit = 8){
      try {
        const body = {
          query: `
            query ($search: String, $type: MediaType) {
              Page(page: 1, perPage: ${limit}) {
                media(search: $search, type: $type) {
                  id
                  title {
                    romaji
                    english
                    native
                  }
                  description(asHtml: false)
                  coverImage {
                    large
                  }
                  studios(isMain: true) {
                    nodes {
                      name
                    }
                  }
                }
              }
            }
          `,
          variables: {
            search: query,
            type: kind
          }
        };

        const data = await fetchJson("https://graphql.anilist.co", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify(body)
        });

        const results = data?.data?.Page?.media || [];
        return results.map(item => {
          const title = item.title?.english || item.title?.romaji || item.title?.native || "Untitled";
          const creator = (item.studios?.nodes || []).map(x => x.name).join(", ");
          const description = String(item.description || "").replace(/<br\s*\/?>/gi, "\n").replace(/<[^>]+>/g, "");
          const category = kind === "ANIME" ? "Anime" : "Manga";
          return {
            title,
            category,
            creator,
            cover: item.coverImage?.large || "",
            description,
            description_ru: "",
            description_en: looksLikeEnglish(description) ? description : "",
            work_key: `anilist:${kind.toLowerCase()}:${item.id}`,
            canonical_key: buildCanonicalKey(category, "anilist", `${kind.toLowerCase()}:${item.id}`, title)
          };
        });
      } catch (e) {
        console.error("AniList search error:", e);
        return [];
      }
    }

    async function searchByCategory(category, query, limit = 8){
      if(category === "Books") return await searchBooksApi(query, limit);
      if(category === "Movies") return await searchMoviesApi(query, "movie", limit);
      if(category === "Series") return await searchMoviesApi(query, "tv", limit);
      if(category === "Anime") return await searchAnimeCombined(query, limit);
      if(category === "Manga") return await searchMangaCombined(query, limit);

    async function searchAllCategories(query){

        searchBooksApi(query, 5),
        searchMoviesApi(query, "movie", 5),
        searchMoviesApi(query, "tv", 5),
        searchAnimeCombined(query, 5),
        searchMangaCombined(query, 5)
      ]);

      return [...books, ...movies, ...series, ...anime, ...manga];

    function dedupeSearchResults(items){
      const seen = new Set();
      return items.filter(item => {
        const key = item.canonical_key || item.work_key || (item.category + ":" + (item.title || "").trim().toLowerCase());
        if(seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function isDuplicateItem(category, title, workKey = ""){
      const items = demoData[category] || [];

      return items.some(item => {
        if(workKey && item.work_key && item.work_key === workKey){
          return true;
        }
        return (item.title || "").trim().toLowerCase() === title.trim().toLowerCase();
      });
    }

    async function existsInSupabase(category, title, workKey = "", canonicalKey = ""){
      const user = await getCurrentUser();
      if(!user) return false;

      let query = supabaseClient
        .from("user_media")
        .select("id, title, work_key, canonical_key")
        .eq("user_id", user.id)
        .eq("category", category)
        .limit(20);

      if(workKey){
        query = query.eq("work_key", workKey);
      } else if(canonicalKey){
        query = query.eq("canonical_key", canonicalKey);
      } else {
        query = query.ilike("title", title);
      }

      const { data, error } = await query;

      if(error){
        console.error("Supabase duplicate check error:", error);
        return false;
      }

      return Array.isArray(data) && data.length > 0;
    }

    async function saveItemToSupabase(
      title,
      category,
      status,
      cover = "",
      description = "",
      creator = "",
      workKey = "",
      canonicalKey = "",
      description_ru = "",
      description_en = ""
    ){
      const user = await getCurrentUser();

      if(!user){
        alert(t().labels.mustBeLoggedIn);
        return false;
      }

      const finalCanonicalKey =
        canonicalKey ||
        workKey ||
        title.trim().toLowerCase();

      const autoLang = splitDescriptionFields(description);

      const insertData = {
        user_id: user.id,
        title: title,
        category: category,
        status: status || "Planned",
        cover_url: cover,
        description: description || "",
        creator: creator || "",
        work_key: workKey || "",
        canonical_key: finalCanonicalKey,
        description_ru: description_ru || autoLang.description_ru || "",
        description_en: description_en || autoLang.description_en || ""
      };

      const { error } = await supabaseClient
        .from("user_media")
        .insert([insertData]);

      if(error){
        console.error("Supabase insert error:", error);
        alert(t().labels.dbSaveError + ": " + error.message);
        return false;
      }

      return true;
    }

    async function loadCategoryFromSupabase(category){
      const user = await getCurrentUser();

      if(!user){
        demoData[category] = [];
        renderShelf();
        return;
      }

      const { data, error } = await supabaseClient
        .from("user_media")
        .select("*")
        .eq("user_id", user.id)
        .eq("category", category)
        .order("id", { ascending: false });

      if(error){
        console.error("Supabase load error:", error);
        demoData[category] = [];
        renderShelf();
        return;
      }

      demoData[category] = [];
      const seen = new Set();

      data.forEach(item => {
        const dedupeKey =
          item.canonical_key ||
          item.work_key ||
          (item.title || "").trim().toLowerCase();

        if(seen.has(dedupeKey)){
          return;
        }

        seen.add(dedupeKey);

        demoData[category].push({
          id: item.id,
          title: item.title,
          status: item.status || "Planned",
          cover: item.cover_url || "",
          description: item.description || "",
          description_ru: item.description_ru || "",
          description_en: item.description_en || "",
          creator: item.creator || "",
          work_key: item.work_key || "",
          canonical_key: item.canonical_key || ""
        });
      });

      renderShelf();
    }

    async function addSearchResultToLibrary(item){
      if(!item) return;

      const targetCategory = item.category;

      if(isDuplicateItem(targetCategory, item.title, item.work_key || "")){
        alert(t().labels.alreadyExists);
        return;
      }

      const existsInDb = await existsInSupabase(
        targetCategory,
        item.title,
        item.work_key || "",
        item.canonical_key || ""
      );

      if(existsInDb){
        alert(t().labels.alreadyExists);
        return;
      }

      let finalDescription = item.description || "";
      let finalDescriptionRu = item.description_ru || "";
      let finalDescriptionEn = item.description_en || "";

      if(targetCategory === "Books"){
        const built = await buildBookDescriptions(item.title, item.creator || "", item.work_key || "");
        finalDescription = built.description || "";
        finalDescriptionRu = built.description_ru || "";
        finalDescriptionEn = built.description_en || "";
      } else if(finalDescription && (!finalDescriptionRu || !finalDescriptionEn)){
        const translated = await translateDescriptionFields(finalDescription);
        finalDescription = translated.description || finalDescription;
        finalDescriptionRu = finalDescriptionRu || translated.description_ru || "";
        finalDescriptionEn = finalDescriptionEn || translated.description_en || "";
      }

      const saved = await saveItemToSupabase(
        item.title,
        targetCategory,
        "Planned",
        item.cover || "",
        finalDescription || "",
        item.creator || "",
        item.work_key || "",
        item.canonical_key || "",
        finalDescriptionRu || "",
        finalDescriptionEn || ""
      );

      if(!saved) return;

      if(currentCategory === targetCategory){
        await loadCategoryFromSupabase(targetCategory);
      }
    }

    async function moveCurrentItemToBlacklist(){
      if(isPublicView) return;
      if(currentCategory === "Blacklist"){
        closeStatusModal();
        return;
      }

      const item = getItemById(currentCategory, currentStatusItemId);
      if(!item) return;

      const confirmed = confirm(t().labels.confirmMoveToBlacklist);
      if(!confirmed) return;

      const oldCategory = currentCategory;
      const oldIndex = (demoData[oldCategory] || []).findIndex(x => x.id === item.id);
      const movedItem = { ...item, status: "Dropped" };

      if(oldIndex !== -1){
        demoData[oldCategory].splice(oldIndex, 1);
      }

      const alreadyThere = demoData.Blacklist.some(x => x.id === item.id || (x.canonical_key && x.canonical_key === item.canonical_key));
      if(!alreadyThere){
        demoData.Blacklist.unshift(movedItem);
      }

      closeStatusModal();
      renderShelf();

      const updated = await updateCategoryInSupabase(item.id, "Blacklist", "Dropped");

      if(!updated){
        if(oldIndex !== -1){
          demoData[oldCategory].splice(oldIndex, 0, item);
        }
        demoData.Blacklist = demoData.Blacklist.filter(x => x.id !== item.id);
        renderShelf();
        alert(t().labels.moveError);
        return;
      }

      if(currentOpenItemId === item.id){
        currentCategory = "Blacklist";
        openCardById(item.id);
      }
    }

    async function ensureItemDescriptions(item){
      if(!item) return item;

      let changed = false;

      if(currentCategory === "Books"){
        if(!item.description_ru || !item.description_en || !item.description){
          const descriptions = await buildBookDescriptions(
            item.title || "",
            item.creator || "",
            item.work_key || ""
          );

          if(descriptions.description && descriptions.description !== item.description){
            item.description = descriptions.description;
            changed = true;
          }
          if(descriptions.description_ru && descriptions.description_ru !== item.description_ru){
            item.description_ru = descriptions.description_ru;
            changed = true;
          }
          if(descriptions.description_en && descriptions.description_en !== item.description_en){
            item.description_en = descriptions.description_en;
            changed = true;
          }
        }
      } else {
        if(currentLanguage === "ru" && !item.description_ru && item.description){
          if(looksLikeRussian(item.description)){
            item.description_ru = item.description;
            changed = true;
          } else if(looksLikeEnglish(item.description)){
            const translated = await translateTextToRussian(item.description);
            if(translated){
              item.description_ru = translated;
              changed = true;
            }
          }
        }

        if(currentLanguage === "en" && !item.description_en && item.description){
          if(looksLikeEnglish(item.description)){
            item.description_en = item.description;
            changed = true;
          } else if(looksLikeRussian(item.description)){
            const translated = await translateTextToEnglish(item.description);
            if(translated){
              item.description_en = translated;
              changed = true;
            }
          }
        }
      }

      if(changed && !isPublicView){
        await updateBookDescriptionsInSupabase(
          item.id,
          item.description || "",
          item.description_ru || "",
          item.description_en || ""
        );
      }

      return item;
    }

    async function deleteItemById(id){

      const confirmed = confirm(t().labels.confirmDelete);
      if(!confirmed) return;

      const index = (demoData[currentCategory] || []).findIndex(x => x.id === id);

      if(index !== -1){
        demoData[currentCategory].splice(index, 1);
      }

      const deleted = await deleteItemFromSupabase(removedItem.id);

      if(!deleted){
        if(index !== -1){
          demoData[currentCategory].splice(index, 0, removedItem);

        renderShelf();
        alert(t().labels.deleteError);
        return;
      }

      if(currentOpenItemId === removedItem.id){
        currentOpenItemId = null;
      }
    }

    async function deleteCurrentItem(){
      if(isPublicView) return;
      if(!currentOpenItemId) return;

      const item = getItemById(currentCategory, currentOpenItemId);
      if(!item){
        alert(t().labels.itemNotFound);
        return;
      }

      const confirmed = confirm(t().labels.confirmDelete);
      if(!confirmed) return;

      const index = (demoData[currentCategory] || []).findIndex(x => x.id === item.id);
      if(index !== -1){
        demoData[currentCategory].splice(index, 1);
      }

      const deleted = await deleteItemFromSupabase(item.id);

      if(!deleted){
        if(index !== -1){
          demoData[currentCategory].splice(index, 0, item);
        }
        alert(t().labels.deleteError);
        return;
      }

      currentOpenItemId = null;
      backToCategory();
      renderShelf();
    }

    async function register(){
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;

      const { error } = await supabaseClient.auth.signUp({
        email: email,
        password: password
      });

      if(error){
        alert(error.message);
        return;
      }

      alert(t().labels.userCreatedCheckEmail);
    }

    async function login(){
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;

      const { error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

      if(error){
        alert(error.message);
        return;
      }

      document.getElementById("auth-screen").classList.add("hidden");
      document.getElementById("home-screen").classList.remove("hidden");

      const loginBtn = document.getElementById("login-top-btn");
      const logoutBtn = document.getElementById("logout-top-btn");
      const profileBtn = document.getElementById("profile-btn");

      if(loginBtn) loginBtn.classList.add("hidden");
      if(logoutBtn) logoutBtn.classList.remove("hidden");
      if(profileBtn) profileBtn.classList.remove("hidden");

      await loadProfile();
    }

    async function logout(){
      await supabaseClient.auth.signOut();
      location.reload();
    }

    async function checkAuth(){
      const user = await getCurrentUser();

      const loginBtn = document.getElementById("login-top-btn");
      const logoutBtn = document.getElementById("logout-top-btn");
      const profileBtn = document.getElementById("profile-btn");

      if(!user){
        document.getElementById("auth-screen").classList.remove("hidden");
        document.getElementById("home-screen").classList.add("hidden");

        if(loginBtn) loginBtn.classList.remove("hidden");
        if(logoutBtn) logoutBtn.classList.add("hidden");
        if(profileBtn) profileBtn.classList.add("hidden");
      } else {
        document.getElementById("auth-screen").classList.add("hidden");
        document.getElementById("home-screen").classList.remove("hidden");

        if(loginBtn) loginBtn.classList.add("hidden");
        if(logoutBtn) logoutBtn.classList.remove("hidden");
        if(profileBtn) profileBtn.classList.remove("hidden");

        await loadProfile();
      }
    }

    async function saveProfile(){
      const username = document.getElementById("profile-username").value.trim();
      const displayName = document.getElementById("profile-display-name").value.trim();
      const isPublic = document.getElementById("profile-public").checked;

      const user = await getCurrentUser();
      if(!user){
        alert(t().labels.mustBeLoggedIn);
        return;
      }

      const { error } = await supabaseClient
        .from("profiles")
        .upsert({
          id: user.id,
          username: username || null,
          display_name: displayName || null,
          is_public: isPublic
        });

      if(error){
        alert(error.message);
        return;
      }

      closeProfileModal();
      alert(t().profile.saved);
    }

    async function loadProfile(){
      const user = await getCurrentUser();
      if(!user) return;

      const { data, error } = await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", user.id)
        .maybeSingle();

      if(error || !data){
        return;
      }

      const usernameInput = document.getElementById("profile-username");
      const displayNameInput = document.getElementById("profile-display-name");
      const publicInput = document.getElementById("profile-public");

      if(usernameInput) usernameInput.value = data.username || "";
      if(displayNameInput) displayNameInput.value = data.display_name || "";
      if(publicInput) publicInput.checked = data.is_public !== false;
    }

    function openPublicCategory(name, profileName = "Library"){
      if(!isPublicView){
        return;
      }

      currentCategory = name;

      hideAllScreens();
      document.getElementById("category-screen").classList.remove("hidden");

      const addBtn = document.getElementById("add-new-btn");
      if(addBtn){
        addBtn.classList.add("hidden");
        addBtn.style.display = "none";
      }

      const tabs = document.getElementById("public-category-tabs");
      if(tabs){
        tabs.classList.remove("hidden");
        tabs.style.display = "flex";
      }

      document.getElementById("category-title").textContent =
        profileName + " — " + translateCategory(name);

      renderShelf();
    }

    async function loadPublicLibrary(username){
      const { data: profile, error: profileError } = await supabaseClient
        .from("profiles")
        .select("id, username, display_name, is_public")
        .eq("username", username)
        .maybeSingle();

      if(profileError){
        console.error(profileError);
        alert(t().labels.profileLookupError);
        return false;
      }

      if(!profile){
        alert(t().labels.userNotFound);
        return false;
      }

      if(profile.is_public === false){
        alert(t().labels.libraryPrivate);
        return false;
      }

      const { data, error } = await supabaseClient
        .from("user_media")
        .select("*")
        .eq("user_id", profile.id)
        .order("id", { ascending: false });

      if(error){
        console.error(error);
        return false;
      }

      isPublicView = true;
      currentPublicProfileName = profile.display_name || profile.username || "Library";

      demoData.Books = [];
      demoData.Movies = [];
      demoData.Series = [];
      demoData.Anime = [];
      demoData.Manga = [];
      demoData.Blacklist = [];

      const seen = new Set();

      data.forEach(item => {
        const dedupeKey =
          item.canonical_key ||
          item.work_key ||
          (item.title || "").trim().toLowerCase();

        const fullKey = `${item.category}:${dedupeKey}`;

        if(seen.has(fullKey)){
          return;
        }

        seen.add(fullKey);

        if(!demoData[item.category]){
          demoData[item.category] = [];
        }

        demoData[item.category].push({
          id: item.id,
          title: item.title,
          status: item.status || "Planned",
          cover: item.cover_url || "",
          description: item.description || "",
          description_ru: item.description_ru || "",
          description_en: item.description_en || "",
          creator: item.creator || "",
          work_key: item.work_key || "",
          canonical_key: item.canonical_key || ""
        });
      });

      hideAllScreens();
      document.getElementById("category-screen").classList.remove("hidden");

      const addBtn = document.getElementById("add-new-btn");
      if(addBtn){
        addBtn.classList.add("hidden");
        addBtn.style.display = "none";
      }

      const tabs = document.getElementById("public-category-tabs");
      if(tabs){
        tabs.classList.remove("hidden");
        tabs.style.display = "flex";
      }

      currentCategory = "Books";

      document.getElementById("category-title").textContent =
        currentPublicProfileName + " — " + translateCategory("Books");

      renderShelf();
      return true;
    }

    async function checkPublicRoute(){
      const path = window.location.pathname;

      if(path.startsWith("/u/")){
        const username = path.replace("/u/", "").trim();

        if(username){
          return await loadPublicLibrary(username);
        }
      }

      return false;
    }

    async function shareLibrary(){
      const user = await getCurrentUser();

      if(!user){
        alert(t().labels.mustBeLoggedIn);
        return;
      }

      const { data, error } = await supabaseClient
        .from("profiles")
        .select("username")
        .eq("id", user.id)
        .maybeSingle();

      if(error || !data?.username){
        alert(t().labels.setUsernameFirst);
        return;
      }

      const url = window.location.origin + "/u/" + data.username;

      try {
        await navigator.clipboard.writeText(url);
        alert(t().labels.libraryLinkCopied + "\n" + url);
      } catch (e) {
        prompt(t().labels.libraryLinkCopied, url);
      }
    }

    async function init(){
      applyTranslations();

      const globalContainer = document.getElementById("global-search-results");
      if(globalContainer){
        globalContainer.innerHTML = `<div class="small">${escapeHtml(t().labels.globalSearchNothing)}</div>`;
      }

      const openedPublic = await checkPublicRoute();

      if(!openedPublic){
        await checkAuth();
      }
    }

    init();
  </script>

</body>
</html>

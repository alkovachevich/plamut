<!doctype html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Plamut</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
font-family:Arial,sans-serif;
background:#111;
color:white;
margin:0;
padding:20px;
}

.hidden{display:none!important}

.topbar{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:20px;
}

.button{
background:#222;
border:1px solid #444;
color:white;
padding:10px 14px;
border-radius:10px;
cursor:pointer;
}

.button:hover{
background:#333;
}

.search-bar{
width:100%;
padding:14px;
font-size:16px;
border-radius:10px;
border:1px solid #444;
background:#111;
color:white;
margin-bottom:14px;
}

.search-filters{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-bottom:20px;
}

.card{
background:#1a1a1a;
border:1px solid #333;
border-radius:14px;
overflow:hidden;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:18px;
}

.cover{
height:240px;
background:#2b2b2b;
display:flex;
align-items:center;
justify-content:center;
}

.cover img{
width:100%;
height:100%;
object-fit:cover;
}

.info{
padding:12px;
}

.badge{
display:inline-block;
font-size:12px;
border:1px solid #444;
padding:4px 8px;
border-radius:8px;
margin-bottom:8px;
color:#bbb;
}

</style>

</head>

<body>

<div class="topbar">

<button class="button" onclick="goHome()">Home</button>
<button class="button" onclick="openCategory('Books')">Books</button>
<button class="button" onclick="openCategory('Movies')">Movies</button>
<button class="button" onclick="openCategory('Series')">Series</button>
<button class="button" onclick="openCategory('Anime')">Anime</button>
<button class="button" onclick="openCategory('Manga')">Manga</button>
<button class="button" onclick="openCategory('Blacklist')">Blacklist</button>

</div>

<input id="global-search" class="search-bar" placeholder="Search books, movies, anime..." oninput="globalSearch()">

<div class="search-filters">

<button class="button" onclick="setSearchFilter('ALL')">ALL</button>
<button class="button" onclick="setSearchFilter('Books')">Books</button>
<button class="button" onclick="setSearchFilter('Movies')">Movies</button>
<button class="button" onclick="setSearchFilter('Series')">Series</button>
<button class="button" onclick="setSearchFilter('Anime')">Anime</button>
<button class="button" onclick="setSearchFilter('Manga')">Manga</button>

</div>

<div id="search-results" class="grid"></div>

<div id="shelf" class="grid"></div>

  <script>

const SUPABASE_URL = "https://rqtqimjenotjspqumeni.supabase.co"

const SUPABASE_ANON_KEY = "sb_publishable_LOzTBbVK8tg6kDOrO8AcrQ_j52hzXTf"

const TMDB_API_KEY = "fc8eab333882a74fe8c8a633e4676d98"

const GOOGLE_BOOKS_API_KEY = "AIzaSyAisvc1YIhHWofTe45-ESHF0JVp9t92Oys"

const supabaseClient = supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
)

let currentCategory="Books"
let searchFilter="ALL"
let demoData={
Books:[],
Movies:[],
Series:[],
Anime:[],
Manga:[],
Blacklist:[]
}

    <script>

const SUPABASE_URL = "https://rqtqimjenotjspqumeni.supabase.co"

const SUPABASE_ANON_KEY = "sb_publishable_LOzTBbVK8tg6kDOrO8AcrQ_j52hzXTf"

const TMDB_API_KEY = "fc8eab333882a74fe8c8a633e4676d98"

const GOOGLE_BOOKS_API_KEY = "AIzaSyAisvc1YIhHWofTe45-ESHF0JVp9t92Oys"

const supabaseClient = supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
)

let currentCategory="Books"
let searchFilter="ALL"
let demoData={
Books:[],
Movies:[],
Series:[],
Anime:[],
Manga:[],
Blacklist:[]
}

    async function globalSearch(){

const q=document.getElementById("global-search").value.trim()

if(!q)return

let results=[]

results=results.concat(await searchBooks(q))
results=results.concat(await searchMovies(q))
results=results.concat(await searchAnime(q))
results=results.concat(await searchManga(q))

renderSearchResults(results)

}

function setSearchFilter(f){

searchFilter=f

globalSearch()

}

    async function searchBooks(q){

try{

const url="https://openlibrary.org/search.json?q="+encodeURIComponent(q)+"&limit=6"

const r=await fetch(url)

const d=await r.json()

return d.docs.map(b=>({

title:b.title,
category:"Books",
creator:(b.author_name||[]).join(", "),
cover:b.cover_i?"https://covers.openlibrary.org/b/id/"+b.cover_i+"-L.jpg":"",
year:b.first_publish_year||""

}))

}catch(e){

return[]

}

}

    async function searchMovies(q){

try{

const url="https://api.themoviedb.org/3/search/multi?api_key="+TMDB_API_KEY+"&query="+encodeURIComponent(q)

const r=await fetch(url)

const d=await r.json()

return d.results.slice(0,6).map(m=>({

title:m.title||m.name,
category:m.media_type==="tv"?"Series":"Movies",
creator:"",
cover:m.poster_path?"https://image.tmdb.org/t/p/w500"+m.poster_path:"",
year:(m.release_date||m.first_air_date||"").slice(0,4)

}))

}catch(e){

return[]

}

}

    async function searchAnime(q){

try{

const url="https://api.jikan.moe/v4/anime?q="+encodeURIComponent(q)

const r=await fetch(url)

const d=await r.json()

return d.data.slice(0,6).map(a=>({

title:a.title,
category:"Anime",
creator:a.studios?.map(s=>s.name).join(", ")||"",
cover:a.images.jpg.image_url,
year:a.year||""

}))

}catch(e){

return[]

}

}

    async function searchManga(q){

try{

const url="https://api.jikan.moe/v4/manga?q="+encodeURIComponent(q)

const r=await fetch(url)

const d=await r.json()

return d.data.slice(0,6).map(a=>({

title:a.title,
category:"Manga",
creator:a.authors?.map(s=>s.name).join(", ")||"",
cover:a.images.jpg.image_url,
year:a.year||""

}))

}catch(e){

return[]

}

}

    function renderSearchResults(list){

const box=document.getElementById("search-results")

box.innerHTML=""

list.forEach(item=>{

if(searchFilter!=="ALL" && item.category!==searchFilter)return

const card=document.createElement("div")

card.className="card"

card.innerHTML=`

<div class="cover">

${item.cover?`<img src="${item.cover}">`:""}

</div>

<div class="info">

<div class="badge">${item.category}</div>

<h3>${item.title}</h3>

<div>${item.creator||""}</div>

<button class="button" onclick='addItem(${JSON.stringify(item)})'>ADD</button>

</div>

`

box.appendChild(card)

})

}

    async function addItem(item){

const user=await supabaseClient.auth.getUser()

if(!user.data.user){

alert("login required")

return

}

await supabaseClient
.from("user_media")
.insert([{

user_id:user.data.user.id,
title:item.title,
category:item.category,
cover_url:item.cover,
creator:item.creator,
status:"Planned"

}])

openCategory(item.category)

}

    async function openCategory(cat){

currentCategory=cat

const user=await supabaseClient.auth.getUser()

if(!user.data.user)return

const {data}=await supabaseClient
.from("user_media")
.select("*")
.eq("user_id",user.data.user.id)
.eq("category",cat)

demoData[cat]=data||[]

renderShelf()

}

function goHome(){

document.getElementById("shelf").innerHTML=""

}

function renderShelf(){

const shelf=document.getElementById("shelf")

shelf.innerHTML=""

demoData[currentCategory].forEach(item=>{

const card=document.createElement("div")

card.className="card"

card.innerHTML=`

<div class="cover">

${item.cover_url?`<img src="${item.cover_url}">`:""}

</div>

<div class="info">

<div class="badge">${item.status}</div>

<h3>${item.title}</h3>

<button class="button" onclick="deleteItem(${item.id})">Delete</button>

</div>

`

shelf.appendChild(card)

})

}

    async function deleteItem(id){

await supabaseClient
.from("user_media")
.delete()
.eq("id",id)

openCategory(currentCategory)

}
    
    </script>

</body>
</html>

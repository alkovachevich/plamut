<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plamut</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#111;
      color:white;
      margin:0;
      padding:30px;
    }

    h1,h2,h3{
      margin-top:0;
    }

    .subtitle{
      color:#888;
      margin-bottom:30px;
    }

    .hidden{
      display:none !important;
    }

    .top-right{
      display:flex;
      justify-content:flex-end;
      margin-bottom:20px;
    }

    .lang-switch{
      display:flex;
      gap:8px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
      gap:20px;
      max-width:1000px;
    }

    .card{
      background:#1a1a1a;
      border:1px solid #333;
      border-radius:14px;
      padding:20px;
      text-align:center;
      cursor:pointer;
      transition:.2s;
    }

    .card:hover{
      background:#222;
    }

    .topbar{
      display:flex;
      gap:12px;
      align-items:center;
      margin-bottom:24px;
      flex-wrap:wrap;
    }

    .button{
      background:#2a2a2a;
      color:white;
      border:1px solid #444;
      border-radius:10px;
      padding:10px 14px;
      cursor:pointer;
    }

    .button:hover{
      background:#333;
    }

    .shelf{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
      gap:18px;
      max-width:1100px;
    }

    .media-card{
      background:#1a1a1a;
      border:1px solid #333;
      border-radius:14px;
      overflow:hidden;
    }

    .media-cover{
      height:220px;
      background:#2b2b2b;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#999;
      font-size:14px;
    }

    .media-info{
      padding:14px;
    }

    .media-title{
      font-size:16px;
      margin:0 0 8px 0;
    }

    .media-status{
      font-size:13px;
      color:#aaa;
      margin-bottom:12px;
    }

    .media-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .add-btn{
      background:#3a3a3a;
      color:white;
      border:none;
      border-radius:8px;
      padding:8px 10px;
      cursor:pointer;
    }

    .add-btn:hover{
      background:#4a4a4a;
    }

    .modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.7);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      z-index:1000;
    }

    .modal-box{
      width:100%;
      max-width:560px;
      background:#1a1a1a;
      border:1px solid #333;
      border-radius:16px;
      padding:20px;
      max-height:85vh;
      overflow:auto;
    }

    .modal-box h3{
      margin-top:0;
    }

    .input,
    .textarea{
      width:100%;
      box-sizing:border-box;
      background:#111;
      color:white;
      border:1px solid #444;
      border-radius:10px;
      padding:12px;
      margin-bottom:12px;
      font:inherit;
    }

    .textarea{
      min-height:100px;
      resize:vertical;
    }

    .modal-actions{
      display:flex;
      gap:10px;
      justify-content:flex-end;
      margin-top:8px;
      flex-wrap:wrap;
    }

    .small{
      color:#888;
      font-size:13px;
      margin-bottom:14px;
    }

    .search-item{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border:1px solid #333;
      border-radius:10px;
      margin-bottom:10px;
      background:#141414;
    }

    .search-item-left{
      min-width:0;
    }

    .search-item-title{
      font-size:14px;
      word-break:break-word;
    }

    .search-item-meta{
      font-size:12px;
      color:#888;
      margin-top:4px;
      word-break:break-word;
    }

    .details-layout{
      display:grid;
      grid-template-columns:minmax(220px, 280px) 1fr;
      gap:24px;
      max-width:1100px;
    }

    .details-cover{
      background:#1a1a1a;
      border:1px solid #333;
      border-radius:16px;
      overflow:hidden;
    }

    .details-cover-box{
      height:380px;
      background:#2b2b2b;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#999;
    }

    .details-cover-box img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .details-panel{
      background:#1a1a1a;
      border:1px solid #333;
      border-radius:16px;
      padding:20px;
    }

    .badge{
      display:inline-block;
      padding:6px 10px;
      border:1px solid #444;
      border-radius:999px;
      color:#bbb;
      font-size:12px;
      margin-right:8px;
      margin-bottom:8px;
    }

    .section{
      margin-top:24px;
    }

    .related-list{
      display:grid;
      gap:10px;
      margin-top:10px;
    }

    .related-item{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
      border:1px solid #333;
      border-radius:12px;
      padding:12px;
      background:#141414;
    }

    .muted{
      color:#999;
    }

    .loading{
      color:#aaa;
      font-size:14px;
      padding:10px 0;
    }

    @media (max-width: 800px){
      .details-layout{
        grid-template-columns:1fr;
      }

      .details-cover-box{
        height:260px;
      }
    }
  </style>
</head>

<body>

  <div class="top-right">
    <div class="lang-switch">
      <button class="button" onclick="setLanguage('en')">EN</button>
      <button class="button" onclick="setLanguage('ru')">RU</button>
    </div>
  </div>

  <div id="home-screen">
    <h1>Plamut</h1>
    <div class="subtitle" id="home-subtitle"></div>

    <div class="grid">
      <div class="card" onclick="openCategory('Books')" id="cat-books"></div>
      <div class="card" onclick="openCategory('Movies')" id="cat-movies"></div>
      <div class="card" onclick="openCategory('Series')" id="cat-series"></div>
      <div class="card" onclick="openCategory('Anime')" id="cat-anime"></div>
      <div class="card" onclick="openCategory('Manga')" id="cat-manga"></div>
      <div class="card" onclick="openCategory('Blacklist')" id="cat-blacklist"></div>
    </div>
  </div>

  <div id="category-screen" class="hidden">
    <div class="topbar">
      <button class="button" onclick="goHome()" id="back-home-btn"></button>
      <h2 id="category-title" style="margin:0;"></h2>
      <button class="button" onclick="addNew()" id="add-new-btn"></button>
    </div>

    <div class="shelf" id="shelf"></div>
  </div>

  <div id="details-screen" class="hidden">
    <div class="topbar">
      <button class="button" onclick="backToCategory()" id="back-shelf-btn"></button>
      <button class="button" onclick="openUniverse()" id="explore-universe-btn"></button>
    </div>

    <div class="details-layout">
      <div class="details-cover">
        <div class="details-cover-box" id="cover-box"></div>
      </div>

      <div class="details-panel">
        <h2 id="details-title">Title</h2>

        <div>
          <span class="badge" id="details-category">Category</span>
          <span class="badge" id="details-status">Status</span>
        </div>

        <div class="section">
          <h3 id="description-label"></h3>
          <div class="muted" id="details-description"></div>
        </div>

        <div class="section">
          <button class="button" onclick="changeStatusFromDetails()" id="change-status-details-btn"></button>
        </div>

        <div class="section">
          <h3 id="related-label"></h3>
          <div class="related-list" id="related-list"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="add-modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="search-modal-title"></h3>
      <div class="small" id="search-modal-subtitle"></div>

      <input
        id="search-input"
        class="input"
        type="text"
        oninput="renderSearchResults()"
      >

      <div id="search-results"></div>

      <div class="modal-actions">
        <button class="button" onclick="openManualModal()" id="manual-add-btn"></button>
        <button class="button" onclick="closeAddModal()" id="close-search-btn"></button>
      </div>
    </div>
  </div>

  <div id="manual-modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="manual-title"></h3>
      <div class="small" id="manual-subtitle"></div>

      <input id="manual-name" class="input" type="text">
      <input id="manual-creator" class="input" type="text">
      <input id="manual-cover" class="input" type="text">
      <textarea id="manual-description" class="textarea"></textarea>

      <div class="modal-actions">
        <button class="button" onclick="closeManualModal()" id="manual-cancel-btn"></button>
        <button class="button" onclick="saveManualItem()" id="manual-save-btn"></button>
      </div>
    </div>
  </div>

  <div id="status-modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="status-modal-title"></h3>

      <div class="modal-actions" style="flex-direction:column;align-items:stretch">
        <button class="button" onclick="setStatus('Planned')" id="status-planned"></button>
        <button class="button" onclick="setStatus('In progress')" id="status-in-progress"></button>
        <button class="button" onclick="setStatus('Done')" id="status-done"></button>
        <button class="button" onclick="setStatus('Dropped')" id="status-dropped"></button>
        <button class="button" onclick="closeStatusModal()" id="status-cancel"></button>
      </div>
    </div>
  </div>

  <div id="progress-modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="progress-title"></h3>

      <div class="modal-actions" style="flex-direction:column;align-items:stretch">
        <button class="button" onclick="openNextWork()" id="progress-next"></button>
        <button class="button" onclick="openUniverseFromModal()" id="progress-universe"></button>
        <button class="button" onclick="closeProgressModal()" id="progress-close"></button>
      </div>
    </div>
  </div>

    const demoData = {

    let currentCategory = null;

    function t() {
      return translations[currentLanguage];

    function setLanguage(lang) {
      currentLanguage = lang;
      document.documentElement.lang = lang;
      applyTranslations();
      rerenderCurrentScreen();
    }

    function applyTranslations() {
      document.getElementById("home-subtitle").textContent = t().subtitle;

      document.getElementById("cat-books").textContent = t().categories.Books;

    function rerenderCurrentScreen() {
      if (!document.getElementById("category-screen").classList.contains("hidden") && currentCategory) {
        document.getElementById("category-title").textContent = translateCategory(currentCategory);
        renderShelf();
      }

      if (!document.getElementById("details-screen").classList.contains("hidden") && currentOpenTitle) {
        openCard(currentOpenTitle);
      }
    }

    function translateStatus(status) {
      return t().statuses[status] || status;
    }

    function translateCategory(category) {
      return t().categoryNames[category] || category;
    }

    async function openCategory(name){
      currentCategory = name;
      hideAllScreens();
      document.getElementById("category-screen").classList.remove("hidden");
      document.getElementById("category-title").textContent = translateCategory(name);
      await loadCategoryFromSupabase(name);
    }

    function renderShelf(){
      const shelf = document.getElementById("shelf");
      shelf.innerHTML = "";

      const items = demoData[currentCategory] || [];

      items.forEach((item, index) => {
        const safeTitle = item.title.replace(/'/g, "\\'");
        const coverHtml = item.cover
          ? `<img src="${item.cover}" alt="${item.title}" style="width:100%;height:100%;object-fit:cover;">`
          : t().labels.cover;

        const card = document.createElement("div");
        card.className = "media-card";
        card.innerHTML = `
          <div class="media-cover">${coverHtml}</div>
          <div class="media-info">
            <h3 class="media-title">${item.title}</h3>
            <div class="media-status">${t().labels.statusLabel}: ${translateStatus(item.status)}</div>
            <div class="media-actions">
              <button class="add-btn" onclick="changeStatus(${index})">${t().buttons.changeStatus}</button>
              <button class="add-btn" onclick="openCard('${safeTitle}')">${t().buttons.open}</button>
            </div>
          </div>
        `;
        shelf.appendChild(card);
      });
    }

    function hideAllScreens(){
      document.getElementById("home-screen").classList.add("hidden");
      document.getElementById("category-screen").classList.add("hidden");
      document.getElementById("details-screen").classList.add("hidden");
    }

    function goHome(){
      hideAllScreens();
      document.getElementById("home-screen").classList.remove("hidden");
    }

    function backToCategory(){
      hideAllScreens();
      document.getElementById("category-screen").classList.remove("hidden");
    }

    function addNew(){
      document.getElementById("add-modal").classList.remove("hidden");
      document.getElementById("search-input").value = "";
      document.getElementById("search-results").innerHTML = "";
      currentBookResults = [];
      document.getElementById("search-input").focus();
    }

    function closeAddModal(){
      document.getElementById("add-modal").classList.add("hidden");
    }

    function openManualModal(){
      document.getElementById("manual-modal").classList.remove("hidden");
      document.getElementById("manual-name").value = document.getElementById("search-input").value.trim();
      document.getElementById("manual-creator").value = "";
      document.getElementById("manual-cover").value = "";
      document.getElementById("manual-description").value = "";
      document.getElementById("manual-name").focus();
    }

    function closeManualModal(){
      document.getElementById("manual-modal").classList.add("hidden");
    }

    async function renderSearchResults() {
  const container = document.getElementById("search-results");
  const input = document.getElementById("search-input");

  if (!container || !input) return;

  const query = input.value.trim();
  container.innerHTML = "";

  if (!query) {
    container.innerHTML = <div class="small">${t().labels.noResults}</div>;
    return;
  }

  if (currentCategory === "Books") {
    container.innerHTML = <div class="loading">${t().labels.searching}</div>;

    try {
      let items = [];

      const url1 =
        "https://www.googleapis.com/books/v1/volumes?q=" +
        encodeURIComponent("intitle:" + query) +
        "&maxResults=10";

      const response1 = await fetch(url1);
      const data1 = await response1.json();
      items = data1.items || [];

      if (items.length === 0) {
        const url2 =
          "https://www.googleapis.com/books/v1/volumes?q=" +
          encodeURIComponent(query) +
          "&maxResults=10";

        const response2 = await fetch(url2);
        const data2 = await response2.json();
        items = data2.items || [];
      }

      if (items.length === 0) {
        currentBookResults = [];
        container.innerHTML = 
          <div class="small">${t().labels.noBooksFound}</div>
          <div class="modal-actions" style="justify-content:flex-start;margin-top:12px;">
            <button class="button" onclick="openManualModal()">${t().buttons.manualAdd}</button>
          </div>
        ;
        return;
      }

      currentBookResults = items;
      container.innerHTML = "";

      items.forEach(function (book, index) {
        const info = book.volumeInfo || {};
        const title = info.title || "Untitled";
        const authors = (info.authors || []).join(", ");

        const row = document.createElement("div");
        row.className = "search-item";
        row.innerHTML = 
          <div class="search-item-left">
            <div class="search-item-title">${title}</div>
            <div class="search-item-meta">${authors || "Book"}</div>
          </div>
          <button class="button" onclick="addGoogleBookResult(${index})">${t().buttons.add}</button>
        ;
        container.appendChild(row);
      });

      container.insertAdjacentHTML(
        "beforeend",
        
        <div class="modal-actions" style="justify-content:flex-start;margin-top:12px;">
          <button class="button" onclick="openManualModal()">${t().buttons.manualAdd}</button>
        </div>
        
      );

      return;
    } catch (error) {
      console.error("Google Books API error:", error);
      currentBookResults = [];
      container.innerHTML = 
        <div class="small">${t().labels.apiError}</div>
        <div class="modal-actions" style="justify-content:flex-start;margin-top:12px;">
          <button class="button" onclick="openManualModal()">${t().buttons.manualAdd}</button>
        </div>
      ;
      return;
    }
  }

  container.innerHTML = 
    <div class="small">${t().labels.noResults}</div>
    <div class="modal-actions" style="justify-content:flex-start;margin-top:12px;">
      <button class="button" onclick="openManualModal()">${t().buttons.manualAdd}</button>
    </div>
  ;
}


    async function addGoogleBookResult(index){
      const book = currentBookResults[index];
      if(!book) return;

      const info = book.volumeInfo || {};
      const title = info.title || "Untitled";
      const description = info.description || "";
      const cover =
        (info.imageLinks && (info.imageLinks.thumbnail || info.imageLinks.smallThumbnail))
          ? (info.imageLinks.thumbnail || info.imageLinks.smallThumbnail)
          : "";
      const authors = (info.authors || []).join(", ");

      const exists = (demoData[currentCategory] || []).some(item => item.title === title);

      if(exists){
        alert(t().labels.alreadyExists);
        return;
      }

      detailsDatabase[title] = {
        description: description || "No description available.",
        related: []
      };

      const saved = await saveItemToSupabase(title, currentCategory, "Planned", cover, description, authors);

      if(!saved) return;

      demoData[currentCategory].unshift({
        title: title,
        status: "Planned",
        cover: cover,
        description: description
      });

      closeAddModal();
      renderShelf();
    }

    async function saveManualItem(){
      const title = document.getElementById("manual-name").value.trim();
      const creator = document.getElementById("manual-creator").value.trim();
      const cover = document.getElementById("manual-cover").value.trim();
      const description = document.getElementById("manual-description").value.trim();

      if(!title){
        alert(t().labels.manualNameRequired);
        return;
      }

      const exists = (demoData[currentCategory] || []).some(item => item.title === title);

      if(exists){
        alert(t().labels.alreadyExists);
        return;
      }

      detailsDatabase[title] = {
        description: description || "No description available.",
        related: []
      };

      const saved = await saveItemToSupabase(title, currentCategory, "Planned", cover, description, creator);

      if(!saved) return;

      demoData[currentCategory].unshift({
        title: title,
        status: "Planned",
        cover: cover,
        description: description
      });

      closeManualModal();
      closeAddModal();
      renderShelf();
    }

    function changeStatus(index){
      currentStatusIndex = index;
      currentOpenTitle = demoData[currentCategory][index].title;
      document.getElementById("status-modal").classList.remove("hidden");
    }

    function changeStatusFromDetails(){
      const index = (demoData[currentCategory] || []).findIndex(item => item.title === currentOpenTitle);

      if(index === -1){
        alert(t().labels.itemNotFound);
        return;
      }

      currentStatusIndex = index;
      document.getElementById("status-modal").classList.remove("hidden");
    }

    async function setStatus(status){
      const item = demoData[currentCategory][currentStatusIndex];
      const oldStatus = item.status;

      item.status = status;
      renderShelf();
      closeStatusModal();

      const updated = await updateStatusInSupabase(item.title, currentCategory, status);

      if(!updated){
        item.status = oldStatus;
        renderShelf();
        alert(t().labels.dbStatusNotSaved);
        return;
      }

      if(!document.getElementById("details-screen").classList.contains("hidden") && currentOpenTitle){
        openCard(currentOpenTitle);
      }

      if(status === "Done"){
        setTimeout(() => {
          document.getElementById("progress-modal").classList.remove("hidden");
        }, 200);
      }
    }

    function closeStatusModal(){
      document.getElementById("status-modal").classList.add("hidden");
    }

    function closeProgressModal(){
      document.getElementById("progress-modal").classList.add("hidden");
    }

    function openCard(title){
      currentOpenTitle = title;

      const item = (demoData[currentCategory] || []).find(x => x.title === title);
      const details = detailsDatabase[title] || {
        description: item?.description || "No detailed description yet.",
        related: []
      };

      hideAllScreens();
      document.getElementById("details-screen").classList.remove("hidden");

      document.getElementById("details-title").textContent = title;
      document.getElementById("details-category").textContent = translateCategory(currentCategory);
      document.getElementById("details-status").textContent = item ? translateStatus(item.status) : "Unknown";
      document.getElementById("details-description").textContent = details.description || "No description available.";

      const coverBox = document.getElementById("cover-box");
      if(item && item.cover){
        coverBox.innerHTML = `<img src="${item.cover}" alt="${title}">`;
      } else {
        coverBox.textContent = t().labels.cover;
      }

      const relatedList = document.getElementById("related-list");
      relatedList.innerHTML = `<div class="muted">${t().labels.noRelated}</div>`;
    }

    function openUniverse(){
      alert(t().labels.universeLater);
    }

    function openUniverseFromModal(){
      closeProgressModal();
      openUniverse();
    }

    function openNextWork(){
      closeProgressModal();

      const nextTitle = nextWorksMap[currentOpenTitle];

      if(!nextTitle){
        alert(t().labels.noNextWork);
        return;
      }

      const exists = (demoData[currentCategory] || []).some(item => item.title === nextTitle);

      if(!exists){
        demoData[currentCategory].unshift({
          title: nextTitle,
          status: "Planned"
        });
        renderShelf();
      }

      openCard(nextTitle);
    }

    async function saveItemToSupabase(title, category, status, cover = "", description = "", creator = ""){
      const { error } = await supabaseClient
        .from("user_media")
        .insert([
          {
            title: title,
            category: category,
            status: status,
            cover_url: cover,
            description: description,
            creator: creator
          }
        ]);

      if(error){
        console.error("Supabase insert error:", error);
        alert(t().labels.dbSaveError + ": " + error.message);
        return false;
      }

      return true;
    }

    async function updateStatusInSupabase(title, category, status){
      const { error } = await supabaseClient
        .from("user_media")
        .update({ status: status })
        .eq("title", title)
        .eq("category", category);

      if(error){
        console.error("Supabase update error:", error);
        alert(t().labels.dbUpdateError + ": " + error.message);
        return false;
      }

      return true;
    }

    async function loadCategoryFromSupabase(category){
      const { data, error } = await supabaseClient
        .from("user_media")
        .select("*")
        .eq("category", category)
        .order("id", { ascending: false });

      if(error){
        console.error("Supabase load error:", error);
        return;
      }

      demoData[category] = [];

      data.forEach(item => {
        demoData[category].push({
          title: item.title,
          status: item.status,
          cover: item.cover_url || "",
          description: item.description || ""
        });

        detailsDatabase[item.title] = {
          description: item.description || "No description available.",
          related: []
        };
      });

      renderShelf();
    }

    applyTranslations();
  </script>

</body>
